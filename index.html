<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放射状思维导图 · F风格</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --node-bg: #ffffff;
            --node-border: #e0e3e8;
            --node-shadow: 0 2px 10px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
            --node-shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
            --text-primary: #2c3e50;
            --text-secondary: #5a6b7d;
            --accent: #5b8ff9;
            --accent-light: #e8f0fe;
            --dot-color: #b8c4d0;
            --dot-active: #5b8ff9;
            --toolbar-bg: rgba(255, 255, 255, 0.92);
            --toolbar-border: #e0e3e8;
            --btn-bg: #ffffff;
            --btn-border: #d0d5dd;
            --btn-text: #3a4a5a;
            --danger: #e74c3c;
            --modal-bg: rgba(0, 0, 0, 0.4);
            --root-bg: linear-gradient(135deg, #5b8ff9 0%, #3b6fe0 100%);
            --root-text: #ffffff;
            --level1-bg: linear-gradient(135deg, #ffffff 0%, #f0f4fa 100%);
            --level2-bg: linear-gradient(135deg, #ffffff 0%, #f7f9fc 100%);
            --level3-bg: #ffffff;
            --node-radius: 10px;
            --dot-r: 7px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: var(--font-family);
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            position: fixed;
            top: 0;
            left: 0;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            background: var(--bg);
            z-index: 1;
        }
        #canvas-container:active { cursor: grabbing; }

        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        #nodes-layer {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: auto;
        }

        .node-wrapper {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .node-box {
            position: relative;
            pointer-events: auto;
            cursor: grab;
            border-radius: var(--node-radius);
            box-shadow: var(--node-shadow);
            border: 1.5px solid var(--node-border);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 16px;
            min-width: 56px;
            min-height: 36px;
            max-width: 220px;
            word-break: break-word;
            white-space: normal;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            background: #ffffff;
            transition: box-shadow 0.18s ease;
            pointer-events: auto;
            cursor: grab;
        }
        .node-box:active { cursor: grabbing; }
        .node-box.selected {
            box-shadow: var(--node-shadow-hover), 0 0 0 3px var(--accent-light);
            border-color: var(--accent);
        }
        .node-box.root-node {
            background: var(--root-bg);
            color: var(--root-text);
            font-weight: 700;
            font-size: 16px;
            border-color: #2f5fc9;
            box-shadow: 0 4px 20px rgba(59, 111, 224, 0.35), 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .node-box.level-1 { background: var(--level1-bg); font-weight: 600; }
        .node-box.level-2 { background: var(--level2-bg); }
        .node-box.level-3 { background: var(--level3-bg); }

        .node-dot {
            position: absolute;
            width: calc(var(--dot-r) * 2);
            height: calc(var(--dot-r) * 2);
            border-radius: 50%;
            background-color: var(--dot-color);
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
            pointer-events: auto;
            cursor: pointer;
            z-index: 3;
            padding: 6px;
            background-clip: content-box;
            background-color: var(--dot-color);
            border: 2px solid #fff;
            transition: background 0.15s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .node-dot.active {
            background-color: var(--dot-active);
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(91, 143, 249, 0.25), 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        #toolbar {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--toolbar-border);
            border-radius: 18px;
            padding: 8px 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
            max-width: 96vw;
            scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar { display: none; }

        .toolbar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 44px;
            height: 44px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            font-family: var(--font-family);
            flex-shrink: 0;
            transition: all 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .toolbar-btn:active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: scale(0.95);
        }
        .toolbar-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .toolbar-btn.primary:active { background: #3b6fe0; border-color: #3b6fe0; }
        .toolbar-btn.danger { color: var(--danger); border-color: #f0c4c4; }
        .toolbar-btn.danger:active { background: var(--danger); color: #fff; border-color: var(--danger); }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #modal-overlay.show { display: flex; }

        #modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        #modal-box h3 { font-size: 17px; margin-bottom: 12px; color: var(--text-primary); font-weight: 700; }
        #modal-box textarea {
            flex: 1;
            min-height: 180px;
            border: 1.5px solid var(--node-border);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-family: var(--font-family);
            resize: vertical;
            outline: none;
            color: var(--text-primary);
            background: #fafbfc;
            user-select: text;
            -webkit-user-select: text;
            touch-action: auto;
            line-height: 1.5;
        }
        #modal-box textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px var(--accent-light); }
        #modal-actions { display: flex; gap: 10px; margin-top: 14px; justify-content: flex-end; }
        .modal-btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid var(--btn-border);
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-family);
            min-height: 42px;
            transition: all 0.15s ease;
        }
        .modal-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .modal-btn.primary:active { background: #3b6fe0; }
        .modal-btn:active { transform: scale(0.96); }

        #zoom-indicator {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: 16px;
            z-index: 9;
            background: var(--toolbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--toolbar-border);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        #hint-text {
            position: fixed;
            top: calc(50% - 20px);
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            font-size: 14px;
            color: #a0aab5;
            font-weight: 500;
            text-align: center;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }
        #hint-text.hidden { opacity: 0; }

        @media (max-width: 480px) {
            .node-box { font-size: 12.5px; padding: 6px 12px; max-width: 160px; border-radius: 8px; min-height: 30px; }
            .node-box.root-node { font-size: 14px; padding: 8px 16px; }
            .toolbar-btn { min-width: 40px; height: 40px; padding: 0 10px; font-size: 12px; border-radius: 10px; }
            #toolbar { padding: 6px 8px; gap: 5px; border-radius: 14px; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
            .node-dot { --dot-r: 6px; }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes-layer"></div>
    </div>

    <div id="hint-text">点击小圆点选中 · 拖动空白平移画布</div>
    <div id="zoom-indicator">100%</div>

    <div id="toolbar">
        <button class="toolbar-btn" data-action="add-child">➕ 子节点</button>
        <button class="toolbar-btn" data-action="add-sibling">🔗 兄弟</button>
        <button class="toolbar-btn" data-action="edit">✏️ 编辑</button>
        <button class="toolbar-btn danger" data-action="delete">🗑️ 删除</button>
        <button class="toolbar-btn" data-action="expand-all">展开</button>
        <button class="toolbar-btn" data-action="collapse-all">收起</button>
        <button class="toolbar-btn" data-action="import">📥 导入</button>
        <button class="toolbar-btn primary" data-action="export-png">📤 导出</button>
        <button class="toolbar-btn" data-action="reset-view">重置</button>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>📥 导入文本生成导图</h3>
            <textarea id="import-textarea" placeholder="支持格式：&#10;• 缩进文本（2空格=1层级）&#10;• Markdown列表（- 或 *）&#10;• 编号列表（1. 2. 3.）&#10;• 井号标题（# ## ###）&#10;&#10;示例：&#10;中心主题&#10;  分支一&#10;    子分支A&#10;    子分支B&#10;  分支二&#10;    子分支C"></textarea>
            <div id="modal-actions">
                <button class="modal-btn" id="modal-cancel">取消</button>
                <button class="modal-btn primary" id="modal-confirm">生成导图</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            console.log('思维导图脚本开始执行');

            // ==================== 数据模型 ====================
            let nodeIdCounter = 0;
            let selectedId = null;

            function createNode(text, parentId = null) {
                return {
                    id: 'n' + (++nodeIdCounter),
                    text: text,
                    parentId: parentId,
                    children: [],
                    depth: 0,
                    angle: 0,
                    sectorStart: 0,
                    sectorEnd: 360,
                    x: 0,
                    y: 0,
                    collapsed: false,
                    dotOffsetX: 0,
                    dotOffsetY: 0,
                };
            }

            // 初始数据
            let rootNode = createNode('中心主题');
            rootNode.depth = 0;
            let node1 = createNode('分支一', rootNode.id);
            let node2 = createNode('分支二', rootNode.id);
            let node3 = createNode('分支三', rootNode.id);
            let node11 = createNode('子分支A', node1.id);
            let node12 = createNode('子分支B', node1.id);
            let node21 = createNode('子分支C', node2.id);
            rootNode.children = [node1, node2, node3];
            node1.children = [node11, node12];
            node2.children = [node21];

            let nodeMap = new Map();

            function buildNodeMap() {
                nodeMap.clear();
                (function traverse(node, parent) {
                    node.depth = parent ? parent.depth + 1 : 0;
                    node.parentId = parent ? parent.id : null;
                    nodeMap.set(node.id, node);
                    node.children.forEach(ch => traverse(ch, node));
                })(rootNode, null);
            }
            buildNodeMap();

            function getNode(id) { return nodeMap.get(id) || null; }

            function getVisibleNodes() {
                const result = [];
                (function traverse(node) {
                    result.push(node);
                    if (!node.collapsed) node.children.forEach(ch => traverse(ch));
                })(rootNode);
                return result;
            }

            // ==================== 布局 ====================
            const LAYOUT = { rootToLevel1: 170, level1ToLevel2: 130, level2ToLevel3: 110, deeper: 95 };

            function getDistance(depth) {
                if (depth === 0) return 0;
                if (depth === 1) return LAYOUT.rootToLevel1;
                if (depth === 2) return LAYOUT.level1ToLevel2;
                if (depth === 3) return LAYOUT.level2ToLevel3;
                return LAYOUT.deeper;
            }

            function calculateLayout() {
                function assignSectors(node, sectorStart, sectorEnd) {
                    node.sectorStart = sectorStart;
                    node.sectorEnd = sectorEnd;
                    const childCount = node.children.length;
                    if (childCount === 0) return;
                    const perChild = (sectorEnd - sectorStart) / childCount;
                    node.children.forEach((child, i) => {
                        const childStart = sectorStart + i * perChild;
                        const childEnd = childStart + perChild;
                        child.angle = childStart + perChild / 2;
                        assignSectors(child, childStart, childEnd);
                    });
                }
                assignSectors(rootNode, 0, 360);
                (function computePositions(node, parentX, parentY) {
                    if (node.depth === 0) {
                        node.x = 0;
                        node.y = 0;
                        node.angle = 0;
                    } else {
                        const dist = getDistance(node.depth);
                        const rad = (node.angle - 90) * Math.PI / 180;
                        node.x = parentX + Math.cos(rad) * dist;
                        node.y = parentY + Math.sin(rad) * dist;
                    }
                    if (!node.collapsed) node.children.forEach(ch => computePositions(ch, node.x, node.y));
                })(rootNode, 0, 0);
            }

            // ==================== 渲染 ====================
            const container = document.getElementById('canvas-container');
            const svgLayer = document.getElementById('svg-layer');
            const nodesLayer = document.getElementById('nodes-layer');
            const zoomIndicator = document.getElementById('zoom-indicator');
            const hintText = document.getElementById('hint-text');

            // 使用窗口尺寸而不是容器尺寸，避免布局延迟问题
            let view = { scale: 1, panX: window.innerWidth / 2, panY: window.innerHeight / 2 };

            function canvasToScreen(cx, cy) {
                return { x: cx * view.scale + view.panX, y: cy * view.scale + view.panY };
            }

            function render() {
                calculateLayout();
                renderSVG();
                renderNodes();
                if (zoomIndicator) zoomIndicator.textContent = Math.round(view.scale * 100) + '%';
            }

            function renderSVG() {
                const w = window.innerWidth || 800;
                const h = window.innerHeight || 600;
                svgLayer.setAttribute('width', w);
                svgLayer.setAttribute('height', h);
                svgLayer.setAttribute('viewBox', `0 0 ${w} ${h}`);
                let svgContent = '';
                getVisibleNodes().forEach(node => {
                    if (node.depth === 0 || !node.parentId) return;
                    const parent = getNode(node.parentId);
                    if (!parent) return;
                    const from = canvasToScreen(parent.x, parent.y);
                    const to = canvasToScreen(node.x, node.y);
                    const mx = (from.x + to.x) / 2;
                    const my = (from.y + to.y) / 2;
                    const cp1x = from.x + (mx - from.x) * 0.5;
                    const cp1y = from.y + (my - from.y) * 0.5;
                    const cp2x = to.x + (mx - to.x) * 0.5;
                    const cp2y = to.y + (my - to.y) * 0.5;
                    svgContent += `<path d="M ${from.x} ${from.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${to.x} ${to.y}" stroke="#b8c9dd" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>`;
                });
                svgLayer.innerHTML = svgContent;
            }

            function renderNodes() {
                nodesLayer.innerHTML = '';
                const visibleNodes = getVisibleNodes();
                if (visibleNodes.length === 0) return;

                visibleNodes.forEach(node => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'node-wrapper';
                    wrapper.dataset.nodeId = node.id;
                    const screenPos = canvasToScreen(node.x, node.y);
                    wrapper.style.left = screenPos.x + 'px';
                    wrapper.style.top = screenPos.y + 'px';

                    const box = document.createElement('div');
                    box.className = 'node-box';
                    if (node.depth === 0) box.classList.add('root-node');
                    else if (node.depth === 1) box.classList.add('level-1');
                    else if (node.depth === 2) box.classList.add('level-2');
                    else box.classList.add('level-3');
                    if (node.id === selectedId) box.classList.add('selected');
                    box.textContent = node.text;
                    box.dataset.nodeId = node.id;

                    const dot = document.createElement('div');
                    dot.className = 'node-dot';
                    if (node.id === selectedId) dot.classList.add('active');
                    dot.dataset.nodeId = node.id;

                    const dotSide = getDotSide(node);
                    const dotOffset = 16;
                    if (dotSide === 'right') {
                        dot.style.right = (-dotOffset) + 'px';
                        dot.style.top = '50%';
                        dot.style.transform = 'translateY(-50%)';
                        node.dotOffsetX = dotOffset;
                        node.dotOffsetY = 0;
                    } else if (dotSide === 'left') {
                        dot.style.left = (-dotOffset) + 'px';
                        dot.style.top = '50%';
                        dot.style.transform = 'translateY(-50%)';
                        node.dotOffsetX = -dotOffset;
                        node.dotOffsetY = 0;
                    } else if (dotSide === 'top') {
                        dot.style.top = (-dotOffset) + 'px';
                        dot.style.left = '50%';
                        dot.style.transform = 'translateX(-50%)';
                        node.dotOffsetX = 0;
                        node.dotOffsetY = -dotOffset;
                    } else {
                        dot.style.bottom = (-dotOffset) + 'px';
                        dot.style.left = '50%';
                        dot.style.transform = 'translateX(-50%)';
                        node.dotOffsetX = 0;
                        node.dotOffsetY = dotOffset;
                    }

                    wrapper.appendChild(box);
                    wrapper.appendChild(dot);
                    nodesLayer.appendChild(wrapper);
                });
                if (hintText) {
                    hintText.classList.toggle('hidden', visibleNodes.length > 1);
                }
            }

            function getDotSide(node) {
                if (node.depth === 0) return 'bottom';
                const parent = getNode(node.parentId);
                if (!parent) return 'right';
                const dx = node.x - parent.x;
                const dy = node.y - parent.y;
                const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                if (angle > -45 && angle <= 45) return 'right';
                if (angle > 45 && angle <= 135) return 'bottom';
                if (angle > 135 || angle <= -135) return 'left';
                return 'top';
            }

            // ==================== 交互 ====================
            let activePointerId = null;
            let startX, startY, startPanX, startPanY;
            let isDragging = false;
            let moved = false;
            const DRAG_THRESHOLD = 5;

            container.addEventListener('pointerdown', (e) => {
                const dotTarget = e.target.closest('.node-dot');
                if (dotTarget) {
                    e.preventDefault();
                    e.stopPropagation();
                    const nodeId = dotTarget.dataset.nodeId;
                    if (nodeId) selectNode(nodeId);
                    return;
                }
                activePointerId = e.pointerId;
                startX = e.clientX;
                startY = e.clientY;
                startPanX = view.panX;
                startPanY = view.panY;
                isDragging = false;
                moved = false;
                container.setPointerCapture(e.pointerId);
                e.preventDefault();
            });

            container.addEventListener('pointermove', (e) => {
                if (e.pointerId !== activePointerId) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                if (Math.sqrt(dx*dx + dy*dy) > DRAG_THRESHOLD) {
                    isDragging = true;
                    moved = true;
                }
                if (isDragging) {
                    view.panX = startPanX + dx;
                    view.panY = startPanY + dy;
                    render();
                }
                e.preventDefault();
            });

            container.addEventListener('pointerup', (e) => {
                if (e.pointerId !== activePointerId) return;
                const wasDragging = isDragging;
                isDragging = false;
                activePointerId = null;
                if (!wasDragging && !moved) {
                    if (!e.target.closest('.node-box') && !e.target.closest('.node-dot')) {
                        selectNode(null);
                    }
                }
                moved = false;
                e.preventDefault();
            });

            container.addEventListener('pointercancel', () => {
                activePointerId = null;
                isDragging = false;
                moved = false;
            });

            // 滚轮缩放
            container.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.08 : 0.08;
                const newScale = Math.max(0.15, Math.min(3, view.scale + delta));
                const ratio = newScale / view.scale;
                view.scale = newScale;
                view.panX = e.clientX - (e.clientX - view.panX) * ratio;
                view.panY = e.clientY - (e.clientY - view.panY) * ratio;
                render();
            }, { passive: false });

            // 双指缩放
            let pinchDist = 0;
            let pinchScale = 1;
            let pinchCX = 0, pinchCY = 0;
            container.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    pinchDist = Math.sqrt(dx*dx + dy*dy);
                    pinchScale = view.scale;
                    pinchCX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    pinchCY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                }
            }, { passive: true });

            container.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && pinchDist > 0) {
                    e.preventDefault();
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    const newScale = Math.max(0.15, Math.min(3, pinchScale * (dist / pinchDist)));
                    const ratio = newScale / view.scale;
                    view.scale = newScale;
                    view.panX = pinchCX - (pinchCX - view.panX) * ratio;
                    view.panY = pinchCY - (pinchCY - view.panY) * ratio;
                    render();
                }
            }, { passive: false });

            container.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) pinchDist = 0;
            }, { passive: true });

            function selectNode(nodeId) {
                selectedId = nodeId;
                renderNodes();
                document.querySelectorAll('.toolbar-btn').forEach(btn => {
                    if (['add-child','add-sibling','edit','delete'].includes(btn.dataset.action)) {
                        btn.style.opacity = selectedId ? '1' : '0.4';
                    }
                });
            }

            // ==================== 节点操作 ====================
            function addChildNode() {
                if (!selectedId) { showToast('请先点击小圆点选中节点'); return; }
                const parent = getNode(selectedId);
                if (!parent) return;
                const newNode = createNode('新节点', parent.id);
                parent.children.push(newNode);
                buildNodeMap();
                selectNode(newNode.id);
                render();
            }

            function addSiblingNode() {
                if (!selectedId || selectedId === rootNode.id) { showToast('请先选中一个非根节点'); return; }
                const node = getNode(selectedId);
                if (!node || !node.parentId) return;
                const parent = getNode(node.parentId);
                if (!parent) return;
                const newNode = createNode('新节点', parent.id);
                const idx = parent.children.indexOf(node);
                parent.children.splice(idx + 1, 0, newNode);
                buildNodeMap();
                selectNode(newNode.id);
                render();
            }

            function deleteNode() {
                if (!selectedId || selectedId === rootNode.id) { showToast('不能删除根节点'); return; }
                const node = getNode(selectedId);
                if (!node || !node.parentId) return;
                const parent = getNode(node.parentId);
                if (!parent) return;
                parent.children = parent.children.filter(ch => ch.id !== selectedId);
                selectedId = null;
                buildNodeMap();
                render();
            }

            function editNode() {
                if (!selectedId) { showToast('请先点击小圆点选中节点'); return; }
                const node = getNode(selectedId);
                if (!node) return;
                const newText = prompt('编辑节点文字:', node.text);
                if (newText !== null && newText.trim() !== '') {
                    node.text = newText.trim();
                    render();
                }
            }

            function expandAll() {
                (function traverse(node) {
                    node.collapsed = false;
                    node.children.forEach(ch => traverse(ch));
                })(rootNode);
                render();
            }

            function collapseAll() {
                (function traverse(node) {
                    if (node.depth > 0) node.collapsed = true;
                    node.children.forEach(ch => traverse(ch));
                })(rootNode);
                render();
            }

            function resetView() {
                view.scale = 1;
                view.panX = window.innerWidth / 2;
                view.panY = window.innerHeight / 2;
                render();
            }

            // ==================== 导入 ====================
            function showImportModal() {
                document.getElementById('modal-overlay').classList.add('show');
                document.getElementById('import-textarea').value = '';
                document.getElementById('import-textarea').focus();
            }

            function hideImportModal() {
                document.getElementById('modal-overlay').classList.remove('show');
            }

            function parseImportText(text) {
                const lines = text.split('\n').filter(l => l.trim() !== '');
                if (lines.length === 0) return null;
                const parsed = [];
                lines.forEach(line => {
                    const trimmed = line.trimEnd();
                    if (!trimmed.trim()) return;
                    let level = 0;
                    let content = trimmed.trim();
                    const headingMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
                    if (headingMatch) {
                        level = headingMatch[1].length - 1;
                        content = headingMatch[2].trim();
                    } else {
                        const indentMatch = trimmed.match(/^(\s*)(.*)$/);
                        const spaces = indentMatch[1].length;
                        level = Math.floor(spaces / 2);
                        content = indentMatch[2].trim();
                        const listMatch = content.match(/^([\-*]|\d+\.)\s+(.*)$/);
                        if (listMatch) {
                            content = listMatch[2].trim();
                        }
                    }
                    if (content) parsed.push({ text: content, level: level });
                });
                return parsed.length > 0 ? parsed : null;
            }
