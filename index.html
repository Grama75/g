<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}

.search-menu-item:last-child{border-bottom:none}

.free-textbox .tb-del{position:absolute;right:-10px;top:-10px;width:22px;height:22px;border-radius:50%;background:#e74c3c;color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid #fff;z-index:3;transform:scale(var(--inv-scale,1));transform-origin:bottom left;user-select:none}
.free-textbox .tb-resize{position:absolute;right:-10px;bottom:-10px;width:20px;height:20px;background:#a0522d;border:2px solid #fff;border-radius:50%;cursor:nwse-resize;z-index:3;transform:scale(var(--inv-scale,1));transform-origin:top left;user-select:none}
#breadcrumb{position:absolute;top:8px;left:8px;right:8px;z-index:6;background:rgba(255,255,255,0.95);border-radius:8px;padding:6px 10px;font-size:12px;color:#8b7d6b;display:none;box-shadow:0 2px 6px rgba(0,0,0,0.06);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}

#breadcrumb .crumb-item:active{background:#e8f0fe}

#bracket-view.show{display:block}
#bracket-pre{font-family:"SFMono-Regular",Consolas,"Courier New",monospace;font-size:13px;line-height:1.75;color:#2c3e50;white-space:pre;-webkit-user-select:text;user-select:text;padding-bottom:80px}
</style>

else{var cnBrMatch=content.match(/^[（(]([一二三四五六七八九十]+)[）)]\s*(.*)$/);
if(cnBrMatch){level+=2;content=cnBrMatch[2].trim();}
else{var checkMatch=content.match(/^[-*+]\s+\[[ x]\]\s*(.*)$/i);
if(checkMatch){content=checkMatch[1].trim();}
else{var listMatch=content.match(/^[-*+]\s+(.*)$/);
if(listMatch){content=listMatch[1].trim();}
else{var romanMatch=content.match(/^(I{1,3}|IV|V|VI{0,3}|IX|X)[.)、]\s*(.*)$/i);
if(romanMatch){level+=1;content=romanMatch[2].trim();}
else{var circleMatch=content.match(/^[①②③④⑤⑥⑦⑧⑨⑩]\s*(.*)$/);
if(circleMatch){level+=2;content=circleMatch[1].trim();}
else{if(/^[-=]{3,}$/.test(content))continue;}}}}}}}}}
if(content)parsed.push({text:content,level:level});
}
if(!parsed.length)return null;

}

        var card=document.createElement('div');
        card.className='doc-card';
        var cnt=0;
        (function t(n){cnt++;n.children.forEach(t);})(d.root);
        var borderColor=cnt<=5?'#bbb':cnt<=15?'#5b8ff9':cnt<=30?'#27ae60':cnt<=50?'#e67e22':'#e74c3c';
        card.style.borderColor=borderColor;
        var thumb=document.createElement('div');
        thumb.className='doc-thumb';
        thumb.textContent='🧠';
        card.appendChild(thumb);
        var footer=document.createElement('div');
        footer.className='doc-card-footer';
        var nameEl=document.createElement('span');
        nameEl.className='doc-card-name';
        nameEl.textContent=d.name||'未命名导图';
        footer.appendChild(nameEl);
        var moreEl=document.createElement('span');
        moreEl.className='doc-more';
        moreEl.textContent='⋮';
        moreEl.addEventListener('click',function(e){ e.stopPropagation(); showContextMenu(e,d.id); });
        footer.appendChild(moreEl);
        card.appendChild(footer);
        card.addEventListener('click',function(e){ if(!e.target.closest('.doc-more'))openDoc(d.id); });
        frag.appendChild(card);
    });
    grid.appendChild(frag);
}
function showContextMenu(e,docId){var menu=document.getElementById('context-menu');menu.innerHTML='<div class="ctx-item" data-act="rename">重命名</div><div class="ctx-item" data-act="export">导出</div><div class="ctx-item" data-act="delete">删除</div><div class="ctx-item" data-act="classify">归类</div>';menu.style.display='block';menu.style.left=Math.min(e.clientX,window.innerWidth-140)+'px';menu.style.top=Math.min(e.clientY,window.innerHeight-220)+'px';menu.onclick=function(ev){var act=ev.target.dataset.act;if(!act)return;menu.style.display='none';if(act==='rename'){var d=docs.find(function(x){return x.id===docId;});var n=prompt('新名称',d.name);if(n&&n.trim()){d.name=n.trim();saveAll();renderRepo();}}else if(act==='delete'){if(confirm('确定删除？')){docs=docs.filter(function(x){return x.id!==docId;});if(currentDocId===docId)currentDocId=null;saveAll();renderRepo();}}else if(act==='export'){exportDocId=docId;document.getElementById('modal-export').classList.add('show');}else if(act==='classify'){if(!folders.length){alert('请先创建文件夹');return;}var names=folders.map(function(f,i){return (i+1)+'.'+f.name;}).join(NL);var c=prompt('输入文件夹序号:'+NL+names);var f=folders[parseInt(c)-1];if(f){var d3=docs.find(function(x){return x.id===docId;});d3.folderId=f.id;saveAll();renderRepo();}}};}
document.addEventListener('click',function(e){if(!e.target.closest('#context-menu'))document.getElementById('context-menu').style.display='none';});
document.getElementById('new-folder-btn').addEventListener('click',function(){var n=prompt('文件夹名称');if(n&&n.trim()){folders.push({id:'f'+Date.now(),name:n.trim(),open:false});saveAll();renderFolders();}});
function renderFolders(){var list=document.getElementById('folder-list');list.innerHTML='';var frag=document.createDocumentFragment();folders.forEach(function(f){var div=document.createElement('div');div.className='folder-item';div.innerHTML='<div class="folder-header"><span class="folder-icon">📁</span><span class="folder-name">'+f.name+'</span><span class="folder-arrow'+(f.open?' open':'')+'">▶</span></div><div class="folder-content'+(f.open?' open':'')+'"></div>';var content=div.querySelector('.folder-content');docs.filter(function(d){return d.folderId===f.id;}).forEach(function(d){var row=document.createElement('div');row.className='folder-doc';row.textContent=d.name;row.addEventListener('click',function(){openDoc(d.id);});content.appendChild(row);});div.querySelector('.folder-header').addEventListener('click',function(){f.open=!f.open;renderFolders();});frag.appendChild(div);});list.appendChild(frag);}
function renderQuoteList(){var list=document.getElementById('quote-list');list.innerHTML='';var frag=document.createDocumentFragment();quotes.forEach(function(q,i){var div=document.createElement('div');div.className='quote-item';div.innerHTML='<div class="qt">'+q.text+'</div><div class="qa">—— '+q.author+'</div>';var del=document.createElement('span');del.className='qdel';del.textContent='×';del.addEventListener('click',function(){quotes.splice(i,1);saveAll();renderQuoteList();});div.appendChild(del);frag.appendChild(div);});list.appendChild(frag);}
document.getElementById('add-quote-btn').addEventListener('click',function(){var t=prompt('名言内容');if(!t)return;var a=prompt('作者');if(!a)return;quotes.push({text:t,author:a});saveAll();renderQuoteList();});
function initQuotes(){if(quotes.length)return;quotes=[{text:'生如夏花之绚烂，死如秋叶之静美。',author:'泰戈尔'},{text:'天空没有翅膀的痕迹，但我已飞过。',author:'泰戈尔'},{text:'世界以痛吻我，我要报之以歌。',author:'泰戈尔'},{text:'凡是过往，皆为序章。',author:'莎士比亚'},{text:'黑夜无论怎样悠长，白昼总会到来。',author:'莎士比亚'},{text:'路漫漫其修远兮，吾将上下而求索。',author:'屈原'},{text:'认识你自己。',author:'苏格拉底'},{text:'未经审视的人生不值得过。',author:'苏格拉底'},{text:'上善若水，水善利万物而不争。',author:'老子'},{text:'学而不思则罔，思而不学则殆。',author:'孔子'},{text:'博观而约取，厚积而薄发。',author:'苏轼'},{text:'读书破万卷，下笔如有神。',author:'杜甫'},{text:'温故而知新，可以为师矣。',author:'孔子'},{text:'知识就是力量。',author:'培根'},{text:'我思故我在。',author:'笛卡尔'},{text:'人生而自由，却无往不在枷锁之中。',author:'卢梭'},{text:'人不能两次踏进同一条河流。',author:'赫拉克利特'},{text:'向死而生。',author:'海德格尔'},{text:'他人即地狱。',author:'萨特'},{text:'如果冬天来了，春天还会远吗？',author:'雪莱'},{text:'吾生也有涯，而知也无涯。',author:'庄子'},{text:'知之者不如好之者，好之者不如乐之者。',author:'孔子'},{text:'学习永远不晚。',author:'高尔基'},{text:'读书是在别人思想的帮助下，建立起自己的思想。',author:'鲁巴金'}];}
function init(){try{loadAll();initQuotes();if(!docs.length){var d={id:'d'+Date.now(),name:'我的第一张导图',root:createNode('中心主题'),folderId:null,updatedAt:Date.now()};docs.push(d);saveAll();}if(!currentDocId||!docs.find(function(d){return d.id===currentDocId;}))currentDocId=docs[0].id;if(typeof updateModeMenu==='function')updateModeMenu();goPage('home');showRandomQuote();}catch(e){alert('初始化错误：'+e.message);}}
init();
var resizeTimer;
window.addEventListener('resize',function(){if(currentPage!=='edit')return;clearTimeout(resizeTimer);resizeTimer=setTimeout(function(){render();},150);});
})();
