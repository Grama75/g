<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>思维导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f0e6;height:100vh;overflow:hidden;position:fixed;width:100%;top:0;left:0}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.active{display:flex}
#home{justify-content:center;align-items:center;padding:30px}
#quote{text-align:center;max-width:600px}
.qtext{font-family:Georgia,"宋体",serif;font-size:22px;color:#4a3f35;line-height:1.6;margin-bottom:8px}
.qauthor{font-size:14px;color:#8b7d6b;text-align:right;font-style:italic}
#createBtn{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);width:90px;height:90px;border-radius:50%;background:#a0522d;color:#fff;font-size:15px;font-weight:600;border:none;cursor:pointer;letter-spacing:1px}
#repo,#folderPage{background:#f5f0e6}
.topbar{height:56px;background:#fff;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #e0dcd5;gap:6px;flex-shrink:0}
.topbar h2{font-size:15px;color:#4a3f35;font-weight:600;flex-shrink:0}
.topbar input{flex:1;padding:6px 10px;border:1.5px solid #e0dcd5;border-radius:16px;font-size:13px;outline:none;background:#f9f7f3;min-width:0}
.topbar button{padding:6px 10px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:12px;cursor:pointer;color:#4a3f35;flex-shrink:0}
.topbar button.primary{background:#a0522d;color:#fff;border-color:#a0522d}
#repoList{flex:1;overflow-y:auto;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start;padding-bottom:80px}
.card{background:#fff;border-radius:10px;border:2px solid #ccc;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-height:130px;position:relative}
.thumb{height:80px;background:#f0ece4;display:flex;align-items:center;justify-content:center;font-size:30px;color:#c5b8a8}
.meta{padding:8px;display:flex;align-items:center;gap:4px}
.name{flex:1;font-size:12px;color:#4a3f35;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#c0c0c0;font-size:16px}
.folderTag{position:absolute;top:6px;right:6px;background:rgba(160,82,45,.85);color:#fff;font-size:10px;padding:2px 6px;border-radius:8px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#edit{background:#f7f8fa}
#editTop{height:50px;background:#fff;display:flex;align-items:center;padding:0 6px;border-bottom:1px solid #e0dcd5;gap:4px;flex-shrink:0}
#editTop button{padding:5px 8px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:11px;cursor:pointer;color:#4a3f35;white-space:nowrap;flex-shrink:0}
#editTop button.mode{background:#eef3fb;border-color:#c8d6ee;color:#3b6fe0;font-weight:600}
#title{flex:1;font-size:12px;font-weight:600;color:#4a3f35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#canvas{flex:1;position:relative;overflow:hidden;touch-action:none}
#nodes{position:absolute;inset:0;touch-action:none}
.node{position:absolute;transform:translate(-50%,-50%);padding:6px 12px;border:1.5px solid #d8dce2;border-radius:8px;background:#fff;font-size:13px;color:#2c3e50;cursor:pointer;max-width:200px;text-align:center;word-break:break-word;line-height:1.35}
.node.root{background:#5b8ff9;color:#fff;font-weight:700;border-color:#3b6fe0}
.node.lv1{background:#eef3fb;font-weight:600}
.node.sel{box-shadow:0 0 0 3px #5b8ff9}
.node.underlined-red{text-decoration:underline;text-decoration-color:#e74c3c;text-decoration-thickness:2px}
.node.underlined-black{text-decoration:underline;text-decoration-color:#2c3e50;text-decoration-thickness:2px}
.node.underlined-blue{text-decoration:underline;text-decoration-color:#3498db;text-decoration-thickness:2px}
#toolbar{background:#fff;border-top:1px solid #e0dcd5;padding:6px;display:flex;gap:4px;overflow-x:auto;flex-shrink:0}
#toolbar button{padding:8px 12px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:12px;cursor:pointer;color:#3a4a5a;white-space:nowrap;flex-shrink:0}
#toolbar button:disabled{opacity:0.4}
#breadcrumb{position:absolute;top:8px;left:8px;right:8px;background:rgba(255,255,255,.95);border-radius:8px;padding:6px 10px;font-size:12px;color:#8b7d6b;display:none;overflow-x:auto;white-space:nowrap;z-index:6}
#breadcrumb.show{display:block}
#breadcrumb span{color:#5b8ff9;cursor:pointer;padding:2px 4px}
#breadcrumb span.cur{color:#2c3e50;font-weight:600;cursor:default}
#bracket{position:absolute;inset:0;background:#fff;padding:16px;overflow:auto;display:none;z-index:5}
#bracket.show{display:block}
#bracket pre{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre;user-select:text;-webkit-user-select:text;color:#2c3e50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:500px;max-height:85vh;display:flex;flex-direction:column}
#modal h3{margin-bottom:10px;font-size:15px;color:#4a3f35}
#modal input,#modal textarea{width:100%;padding:10px;border:1.5px solid #e0dcd5;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none;font-family:inherit}
#modal textarea{flex:1;min-height:200px;resize:vertical;font-family:monospace;font-size:13px;line-height:1.6}
#modal .row{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
#modal button{padding:8px 14px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer}
#modal button.primary{background:#a0522d;color:#fff;border-color:#a0522d}
#modal .hint{font-size:12px;color:#8b7d6b;margin-bottom:8px;line-height:1.5}
#folderList{flex:1;overflow-y:auto;padding:12px}
.fitem{background:#fff;border:1px solid #e0dcd5;border-radius:8px;padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.tb{position:absolute;background:#fffde7;border:1.5px dashed #a0522d;border-radius:6px;padding:6px;font-size:12px;color:#4a3f35;min-width:100px;min-height:50px;z-index:5;word-break:break-word;white-space:pre-wrap}
.tb .tbClose{position:absolute;top:-8px;right:-8px;width:18px;height:18px;background:#e74c3c;color:#fff;border-radius:50%;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#notePopup{position:fixed;background:#fff;border-radius:8px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);font-size:13px;color:#4a3f35;max-width:260px;display:none;z-index:200;word-break:break-word}
</style>
</head>
<body>

<div id="home" class="page active">
  <div id="quote"><div class="qtext"></div><div class="qauthor"></div></div>
  <button id="createBtn">Create</button>
</div>

<div id="repo" class="page">
  <div class="topbar">
    <h2>仓库</h2>
    <input id="searchInput" placeholder="搜索..." oninput="renderRepo()">
    <button onclick="showImport()">导入</button>
    <button onclick="showFolders()">📁</button>
    <button class="primary" onclick="newDoc()">+</button>
  </div>
  <div id="repoList"></div>
</div>

<div id="folderPage" class="page">
  <div class="topbar">
    <h2 style="flex:1">文件夹</h2>
    <button onclick="showPage('repo')">← 返回</button>
    <button class="primary" onclick="newFolder()">+ 新建</button>
  </div>
  <div id="folderList"></div>
</div>

<div id="edit" class="page">
  <div id="editTop">
    <button onclick="backRepo()">←</button>
    <span id="title">未命名</span>
    <button onclick="cycleLayout()" id="layoutBtn">缩进</button>
    <button onclick="cycleMode()" id="modeBtn" class="mode">编辑</button>
    <button onclick="showExport()">导出</button>
  </div>
  <div id="canvas">
    <div id="breadcrumb"></div>
    <div id="nodes"></div>
    <div id="bracket"><pre id="bracketText"></pre></div>
  </div>
  <div id="toolbar"></div>
</div>

<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="notePopup"></div>

<script src="./app.js"></script>
</body>
</html>
