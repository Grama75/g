<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>思维导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",sans-serif;background:#f5f0e6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
#topbar{height:50px;background:#fff;display:flex;align-items:center;padding:0 8px;border-bottom:1px solid #e0dcd5;gap:6px;flex-shrink:0}
#title{flex:1;font-size:14px;font-weight:600;color:#4a3f35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{padding:6px 12px;border:1px solid #d0d5dd;border-radius:8px;background:#fff;font-size:13px;cursor:pointer;color:#4a3f35}
button.primary{background:#a0522d;color:#fff;border-color:#a0522d}
#canvas{flex:1;position:relative;overflow:hidden}
#nodes{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);padding:6px 12px;border:1.5px solid #d8dce2;border-radius:8px;background:#fff;font-size:13px;color:#2c3e50;cursor:pointer;max-width:200px;text-align:center;word-break:break-word;line-height:1.35}
.node.root{background:#5b8ff9;color:#fff;font-weight:700;border-color:#3b6fe0}
.node.lv1{background:#eef3fb;font-weight:600}
.node.sel{box-shadow:0 0 0 3px #5b8ff9}
#toolbar{background:#fff;border-top:1px solid #e0dcd5;padding:6px;display:flex;gap:4px;overflow-x:auto;flex-shrink:0}
#breadcrumb{position:absolute;top:8px;left:8px;right:8px;background:rgba(255,255,255,.95);border-radius:8px;padding:6px 10px;font-size:12px;color:#8b7d6b;display:none;overflow-x:auto;white-space:nowrap;z-index:6}
#breadcrumb.show{display:block}
#breadcrumb span{color:#5b8ff9;cursor:pointer;padding:2px 4px}
#breadcrumb span.cur{color:#2c3e50;font-weight:600;cursor:default}
#bracket{position:absolute;inset:0;background:#fff;padding:16px;overflow:auto;display:none;z-index:5}
#bracket.show{display:block}
#bracket pre{font-family:"SFMono-Regular",Consolas,monospace;font-size:12.5px;line-height:1.7;white-space:pre;user-select:text;-webkit-user-select:text;color:#2c3e50}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:400px}
#modal h3{margin-bottom:10px;font-size:15px;color:#4a3f35}
#modal input{width:100%;padding:10px;border:1.5px solid #e0dcd5;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none}
</style>
</head>
<body>
<div id="topbar">
<button onclick="goHome()">←</button>
<span id="title">未命名导图</span>
<button onclick="cycleLayout()" id="layoutBtn">缩进</button>
<button onclick="exportMD()">导出 MD</button>
</div>
<div id="canvas">
<div id="breadcrumb"></div>
<div id="nodes"></div>
<div id="bracket"><pre id="bracketText"></pre></div>
</div>
<div id="toolbar">
<button onclick="addChild()">+ 子节点</button>
<button onclick="showEdit()">编辑</button>
<button onclick="toggleCollapse()">折叠/展开</button>
<button onclick="delNode()">删除</button>
<button onclick="toggleFocus()">聚焦/取消</button>
</div>
<div id="modal"><div class="box"><h3>编辑节点</h3><input id="editInput" placeholder="节点文字"><div style="text-align:right"><button onclick="closeModal()">取消</button> <button class="primary" onclick="saveEdit()">保存</button></div></div></div>
<script>
var STORAGE='mindmap_simple';
var doc={name:'未命名导图',root:null};
var layout='indent';
var selectedId=null;
var focusId=null;
var nodeMap={};

function makeNode(text,pid){
  return {id:'n'+Math.random().toString(36).slice(2,10),text:text,parent:pid||null,children:[],collapsed:false};
}

function load(){
  try{
    var raw=localStorage.getItem(STORAGE);
    if(raw){var d=JSON.parse(raw);if(d&&d.root)doc=d;}
  }catch(e){}
  if(!doc.root)doc.root=makeNode('中心主题');
}

function save(){
  try{localStorage.setItem(STORAGE,JSON.stringify(doc));}catch(e){}
}

function buildMap(){
  nodeMap={};
  (function walk(n,depth,parent){
    n.depth=depth;n.parentNode=parent;
    nodeMap[n.id]=n;
    n.children.forEach(function(c){walk(c,depth+1,n);});
  })(doc.root,0,null);
}

function getRoot(){
  if(!focusId)return doc.root;
  return nodeMap[focusId]||doc.root;
}

function visible(){
  var r=[];
  (function walk(n){
    r.push(n);
    if(!n.collapsed)n.children.forEach(walk);
  })(getRoot());
  return r;
}

function layoutIndent(root){
  var y=0,IND=22,GAP=6;
  var maxRight=0;
  var maxW=Math.max(window.innerWidth-60,200);
  (function walk(n,x){
    var textW=n.text.length*13*0.7+20;
    n.w=Math.min(Math.max(textW,50),Math.max(maxW-x,60));
    var lines=Math.ceil(textW/(n.w-16));
    n.h=Math.max(30,lines*19+12);
    n.x=x+n.w/2;
    n.y=y+n.h/2;
    if(n.x+n.w/2>maxRight)maxRight=n.x+n.w/2;
    y+=n.h+GAP;
    if(!n.collapsed)n.children.forEach(function(c){walk(c,x+IND);});
  })(root,0);
  var totalH=y;
  (function shift(n){
    n.x-=maxRight/2;
    n.y-=totalH/2;
    n.children.forEach(shift);
  })(root);
}

function layoutRadial(root){
  (function assign(n,s,e){
    var k=n.children.length;
    if(!k)return;
    var per=(e-s)/k;
    for(var i=0;i<k;i++){
      var c=n.children[i];
      c.angle=s+i*per+per/2;
      assign(c,s+i*per,s+i*per+per);
    }
  })(root,0,360);
  (function place(n,px,py){
    if(n.depth===0){n.x=0;n.y=0;}
    else{
      var p=n.parentNode;
      if(p){
        var d=p.depth===0?180:p.depth===1?160:140;
        var r=(n.angle-90)*Math.PI/180;
        n.x=px+Math.cos(r)*d;
        n.y=py+Math.sin(r)*d;
      }
    }
    if(!n.collapsed)n.children.forEach(function(c){place(c,n.x,n.y);});
  })(root,0,0);
}

function escapeHTML(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function renderBracket(root){
  var lines=[];
  (function walk(n,prefix,isLast,depth){
    if(depth===0)lines.push(n.text);
    else lines.push(prefix+(isLast?'└─ ':'├─ ')+n.text);
    var cp=prefix+(depth===0?'':(isLast?'   ':'│  '));
    n.children.forEach(function(c,i){walk(c,cp,i===n.children.length-1,depth+1);});
  })(root,'',true,0);
  document.getElementById('bracketText').textContent=lines.join('\n');
}

function render(){
  buildMap();
  var root=getRoot();
  var nodesEl=document.getElementById('nodes');
  var bracketEl=document.getElementById('bracket');
  var bcEl=document.getElementById('breadcrumb');

  if(layout==='bracket'){
    nodesEl.style.display='none';
    bracketEl.classList.add('show');
    renderBracket(root);
    bcEl.classList.remove('show');
    return;
  }
  nodesEl.style.display='';
  bracketEl.classList.remove('show');

  if(layout==='indent')layoutIndent(root);
  else layoutRadial(root);

  var vis=visible();
  var cv=document.getElementById('canvas');
  var cx=cv.clientWidth/2, cy=cv.clientHeight/2;
  var html='';
  vis.forEach(function(n){
    var x=cx+n.x, y=cy+n.y;
    var cls='node';
    if(n.depth===0)cls+=' root';
    else if(n.depth===1)cls+=' lv1';
    if(n.id===selectedId)cls+=' sel';
    var w=n.w||Math.min(Math.max(n.text.length*8+24,50),180);
    html+='<div class="'+cls+'" style="left:'+x+'px;top:'+y+'px;max-width:'+w+'px" data-id="'+n.id+'">'+escapeHTML(n.text)+'</div>';
  });
  nodesEl.innerHTML=html;

  var items=nodesEl.querySelectorAll('.node');
  for(var i=0;i<items.length;i++){
    items[i].addEventListener('click',function(e){
      e.stopPropagation();
      selectedId=this.getAttribute('data-id');
      render();
    });
  }

  if(layout==='indent'&&focusId){
    var path=[];
    var cur=nodeMap[focusId];
    while(cur){path.unshift(cur);cur=cur.parentNode;}
    path.unshift(doc.root);
    var uniq=[];
    path.forEach(function(n){if(!uniq.length||uniq[uniq.length-1]!==n)uniq.push(n);});
    var h='';
    uniq.forEach(function(n,i){
      if(i)h+=' › ';
      var isCur=(i===uniq.length-1);
      h+='<span class="'+(isCur?'cur':'')+'" data-id="'+(n===doc.root?'':n.id)+'">'+escapeHTML(n.text)+'</span>';
    });
    bcEl.innerHTML=h;
    bcEl.classList.add('show');
    var sps=bcEl.querySelectorAll('span:not(.cur)');
    for(var j=0;j<sps.length;j++){
      sps[j].onclick=function(){
        var id=this.getAttribute('data-id');
        focusId=id||null;
        selectedId=null;
        render();
      };
    }
  }else{
    bcEl.classList.remove('show');
  }
}

function cycleLayout(){
  var order=['indent','radial','bracket'];
  var i=order.indexOf(layout);
  layout=order[(i+1)%order.length];
  document.getElementById('layoutBtn').textContent={indent:'缩进',radial:'放射',bracket:'括号'}[layout];
  focusId=null;
  render();
}

function addChild(){
  if(!selectedId)return alert('先选一个节点');
  var p=nodeMap[selectedId];
  var n=makeNode('新节点',p.id);
  p.children.push(n);
  p.collapsed=false;
  selectedId=n.id;
  save();
  render();
}

function showEdit(){
  if(!selectedId)return alert('先选一个节点');
  document.getElementById('editInput').value=nodeMap[selectedId].text;
  document.getElementById('modal').classList.add('show');
}

function saveEdit(){
  var v=document.getElementById('editInput').value.trim();
  if(v&&selectedId)nodeMap[selectedId].text=v;
  closeModal();
  save();
  render();
}

function closeModal(){document.getElementById('modal').classList.remove('show');}

function toggleCollapse(){
  if(!selectedId)return alert('先选一个节点');
  var n=nodeMap[selectedId];
  if(!n.children.length)return alert('没有子节点');
  n.collapsed=!n.collapsed;
  save();
  render();
}

function delNode(){
  if(!selectedId)return;
  var n=nodeMap[selectedId];
  if(!n.parentNode)return alert('不能删除根节点');
  if(!confirm('删除该节点及其所有子节点？'))return;
  var p=n.parentNode;
  p.children=p.children.filter(function(c){return c.id!==n.id;});
  selectedId=null;
  save();
  render();
}

function toggleFocus(){
  if(!selectedId){focusId=null;}
  else if(focusId===selectedId){focusId=null;}
  else{focusId=selectedId;}
  selectedId=null;
  render();
}

function exportMD(){
  var lines=[];
  (function walk(n,d){
    var p='';
    for(var i=0;i<d;i++)p+='  ';
    lines.push(p+'- '+n.text);
    n.children.forEach(function(c){walk(c,d+1);});
  })(doc.root,0);
  var blob=new Blob([lines.join('\n')],{type:'text/markdown;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(doc.name||'导图')+'.md';
  a.click();
}

function goHome(){
  focusId=null;
  selectedId=null;
  render();
}

load();
render();
</script>
</body>
</html>
