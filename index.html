<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>XMind 放射 · 坐标修正</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f5f7fa;display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#1f2937}

#header{background:#ffffff;padding:8px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8eaed;flex-shrink:0;height:44px}
#header h1{font-size:17px;font-weight:600;color:#1f2937;letter-spacing:-0.3px}
#header .badge{font-size:13px;color:#9ca3af;font-weight:400}

#canvas-wrapper{flex:1;overflow:hidden;position:relative;background:#fafbfc;touch-action:none;cursor:grab}
#canvas-wrapper:active{cursor:grabbing}
#radial-canvas{width:100%;height:100%;display:block;transform-origin:0 0;touch-action:none}

#bottom-toolbar{background:#ffffff;border-top:1px solid #e8eaed;display:flex;flex-wrap:wrap;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom);flex-shrink:0}
#bottom-toolbar .group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#bottom-toolbar button{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#6b7280;padding:4px 12px;min-height:40px;min-width:44px;touch-action:manipulation;border-radius:10px;transition:background 0.15s}
#bottom-toolbar button .icon{font-size:18px;line-height:1.2}
#bottom-toolbar button .label{margin-top:2px;font-size:9px;font-weight:500}
#bottom-toolbar button:active{background:#f3f4f6;color:#2563eb}
#bottom-toolbar .del:active{color:#dc2626}
#bottom-toolbar .zoom-btn{background:#f3f4f6;border-radius:24px;padding:2px 14px;flex-direction:row;gap:4px;min-height:32px}
#bottom-toolbar .zoom-btn:active{background:#e5e7eb}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:999;backdrop-filter:blur(4px)}
.modal.active{display:flex}
.modal-box{background:#ffffff;border-radius:20px;padding:24px;width:92%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.15)}
.modal-box h3{font-size:18px;font-weight:600;margin-bottom:6px;color:#1f2937}
.modal-box p{font-size:14px;color:#6b7280;margin:6px 0 14px;line-height:1.5}
.modal-box textarea{width:100%;height:150px;padding:12px;border:1px solid #d1d5db;border-radius:12px;font-size:14px;resize:vertical;font-family:inherit;background:#f9fafb;transition:border 0.2s}
.modal-box textarea:focus{border-color:#2563eb;outline:none;background:#ffffff}
.modal-box .btn-row{display:flex;gap:10px;margin-top:16px;justify-content:flex-end}
.modal-box .btn-row button{padding:10px 24px;border-radius:30px;border:none;font-size:14px;font-weight:500;min-height:40px;cursor:pointer}
.modal-box .btn-row .primary{background:#2563eb;color:#fff}
.modal-box .btn-row .primary:active{background:#1d4ed8}
.modal-box .btn-row .secondary{background:#f3f4f6;color:#4b5563}
.modal-box .btn-row .secondary:active{background:#e5e7eb}
</style>
</head>
<body>

<div id="header">
  <h1>🧠 XMind 放射</h1>
  <span class="badge" id="node-count">0 节点</span>
</div>

<div id="canvas-wrapper">
  <canvas id="radial-canvas"></canvas>
</div>

<div id="bottom-toolbar">
  <div class="group">
    <button onclick="addChild()"><span class="icon">➕</span><span class="label">子</span></button>
    <button onclick="addSibling()"><span class="icon">↕️</span><span class="label">兄弟</span></button>
    <button onclick="editNode()"><span class="icon">✏️</span><span class="label">编辑</span></button>
    <button class="del" onclick="deleteNode()"><span class="icon">🗑️</span><span class="label">删除</span></button>
  </div>
  <div class="group">
    <button onclick="showImportModal()"><span class="icon">📥</span><span class="label">导入</span></button>
    <button onclick="exportImage()"><span class="icon">🖼️</span><span class="label">导出</span></button>
    <button onclick="toggleAll(1)"><span class="icon">📂</span><span class="label">展开</span></button>
    <button onclick="toggleAll(0)"><span class="icon">📁</span><span class="label">收起</span></button>
  </div>
  <div class="group">
    <button class="zoom-btn" onclick="zoomIn()"><span class="icon">➕</span></button>
    <button class="zoom-btn" onclick="resetView()"><span class="icon">⟲</span></button>
    <button class="zoom-btn" onclick="zoomOut()"><span class="icon">➖</span></button>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="modal-box">
    <h3>📥 导入大纲</h3>
    <p>缩进表示层级（2空格或1 Tab）</p>
    <textarea id="importText" placeholder="年度计划&#10;  学习&#10;    前端&#10;    英语&#10;  健身&#10;    跑步"></textarea>
    <div class="btn-row">
      <button class="secondary" onclick="closeImportModal()">取消</button>
      <button class="primary" onclick="importFromText()">生成导图</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 数据模型
// ============================================================
let treeData = {
  id: 'root',
  text: '🎯 中心主题',
  collapsed: false,
  color: '#1f2937',
  children: [
    {
      id: 'n1',
      text: '需求分析',
      collapsed: false,
      color: '#3b82f6',
      children: [
        { id: 'n1-1', text: '用户调研', collapsed: false, color: '#60a5fa', children: [] },
        { id: 'n1-2', text: '竞品分析', collapsed: false, color: '#60a5fa', children: [] }
      ]
    },
    {
      id: 'n2',
      text: '技术选型',
      collapsed: false,
      color: '#f59e0b',
      children: [
        { id: 'n2-1', text: '前端框架', collapsed: false, color: '#fbbf24', children: [] },
        { id: 'n2-2', text: '后端语言', collapsed: false, color: '#fbbf24', children: [] }
      ]
    },
    {
      id: 'n3',
      text: '部署上线',
      collapsed: false,
      color: '#8b5cf6',
      children: [
        { id: 'n3-1', text: '服务器配置', collapsed: false, color: '#a78bfa', children: [] }
      ]
    }
  ]
};
let selectedId = null; // 初始无选中
let idCounter = 100;

// ============================================================
// 视图控制 + 高DPI
// ============================================================
const view = { scale: 1, panX: 0, panY: 0 };
const wrapper = document.getElementById('canvas-wrapper');
const canvas = document.getElementById('radial-canvas');
const ctx = canvas.getContext('2d');
let dpr = 1;

function resizeCanvas() {
  const rect = wrapper.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale(dpr, dpr);
  canvas._logicalWidth = rect.width;
  canvas._logicalHeight = rect.height;
}

function updateTransform() {
  canvas.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.scale})`;
}

function zoomIn() { view.scale = Math.min(2.5, view.scale + 0.15); updateTransform(); drawRadial(); }
function zoomOut() { view.scale = Math.max(0.3, view.scale - 0.15); updateTransform(); drawRadial(); }
function resetView() { view.scale = 1; view.panX = 0; view.panY = 0; updateTransform(); drawRadial(); }

wrapper.addEventListener('wheel', function(e) {
  e.preventDefault();
  view.scale = Math.min(2.5, Math.max(0.3, view.scale + (e.deltaY > 0 ? -0.08 : 0.08)));
  updateTransform(); drawRadial();
}, { passive: false });

// 拖动（鼠标+触屏）
let isPanning = false, startX, startY, startPanX, startPanY;
wrapper.addEventListener('mousedown', function(e) {
  if (e.target === canvas || e.target === wrapper) {
    isPanning = true;
    startX = e.clientX; startY = e.clientY;
    startPanX = view.panX; startPanY = view.panY;
    wrapper.style.cursor = 'grabbing';
  }
});
window.addEventListener('mousemove', function(e) {
  if (!isPanning) return;
  view.panX = startPanX + (e.clientX - startX) * 0.7;
  view.panY = startPanY + (e.clientY - startY) * 0.7;
  updateTransform(); drawRadial();
});
window.addEventListener('mouseup', function() {
  if (isPanning) { isPanning = false; wrapper.style.cursor = 'grab'; }
});

let touchPan = null;
wrapper.addEventListener('touchstart', function(e) {
  if (e.target === canvas || e.target === wrapper) {
    const t = e.touches[0];
    touchPan = { x: t.clientX, y: t.clientY, panX: view.panX, panY: view.panY };
  }
}, { passive: true });
wrapper.addEventListener('touchmove', function(e) {
  if (!touchPan) return;
  const t = e.touches[0];
  view.panX = touchPan.panX + (t.clientX - touchPan.x) * 0.7;
  view.panY = touchPan.panY + (t.clientY - touchPan.y) * 0.7;
  updateTransform(); drawRadial();
}, { passive: true });
wrapper.addEventListener('touchend', function() { touchPan = null; }, { passive: true });

// ============================================================
// 核心绘制：XMind风格 + 均匀角度 + 触控小圆点
// ============================================================
function drawRadial() {
  const W = canvas._logicalWidth || wrapper.clientWidth;
  const H = canvas._logicalHeight || wrapper.clientHeight;
  ctx.clearRect(0, 0, W, H);
  if (!treeData) return;

  // 1. 收集可见节点
  const nodes = [];
  function collect(node, parentId, depth) {
    if (node.collapsed) return;
    nodes.push({
      id: node.id,
      text: node.text,
      color: node.color || '#3b82f6',
      parentId: parentId,
      depth: depth,
      children: node.children || [],
      collapsed: node.collapsed
    });
    if (node.children) {
      node.children.forEach(c => collect(c, node.id, depth + 1));
    }
  }
  collect(treeData, null, 0);

  const rootNode = nodes.find(n => n.id === 'root');
  if (!rootNode) return;

  const cx = W / 2, cy = H / 2;
  const baseRadius = Math.min(W, H) * 0.20;

  // 2. 均匀分配角度
  function assignAngles(list, parentId, depth) {
    const children = list.filter(n => n.parentId === parentId);
    if (children.length === 0) return;
    const parent = list.find(n => n.id === parentId);
    let startAngle, endAngle;
    if (parentId === 'root') {
      startAngle = -Math.PI;
      endAngle = Math.PI;
    } else {
      const halfRange = Math.min(0.6, Math.PI / (children.length + 1));
      startAngle = parent.angle - halfRange;
      endAngle = parent.angle + halfRange;
    }
    const range = endAngle - startAngle;
    const step = range / children.length;
    children.forEach((child, i) => {
      child.angle = startAngle + step * (i + 0.5);
      const r = baseRadius * (depth + 0.8) * 0.85;
      child.radius = Math.min(r, Math.max(W, H) * 0.35);
      assignAngles(list, child.id, depth + 1);
    });
  }

  rootNode.angle = 0;
  rootNode.radius = 0;
  rootNode.x = cx;
  rootNode.y = cy;
  assignAngles(nodes, 'root', 1);

  // 3. 计算坐标
  nodes.forEach(n => {
    if (n.id === 'root') return;
    const parent = nodes.find(p => p.id === n.parentId);
    if (parent && parent.x !== undefined) {
      const ang = n.angle || 0;
      const r = n.radius || 60;
      n.x = parent.x + Math.cos(ang) * r;
      n.y = parent.y + Math.sin(ang) * r;
    }
  });

  // 4. 绘制连线
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  nodes.forEach(n => {
    if (n.id === 'root') return;
    const parent = nodes.find(p => p.id === n.parentId);
    if (parent && parent.x !== undefined) {
      const midX = (parent.x + n.x) / 2 + (n.y - parent.y) * 0.2;
      const midY = (parent.y + n.y) / 2 - (n.x - parent.x) * 0.2;
      ctx.beginPath();
      ctx.moveTo(parent.x, parent.y);
      ctx.quadraticCurveTo(midX, midY, n.x, n.y);
      ctx.strokeStyle = '#d1d5db';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(0,0,0,0.02)';
      ctx.shadowBlur = 4;
      ctx.stroke();
      ctx.shadowColor = 'transparent';
    }
  });

  // 5. 绘制节点 + 触控小圆点
  nodes.forEach(n => {
    const x = n.x, y = n.y;
    if (x === undefined || y === undefined) return;
    const isRoot = n.id === 'root';
    const w = isRoot ? 120 : 80;
    const h = isRoot ? 44 : 36;
    const radius = isRoot ? 22 : 18;
    const color = n.color || (isRoot ? '#1f2937' : '#3b82f6');

    // ---- 节点方框 ----
    ctx.shadowColor = 'rgba(0,0,0,0.06)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetX = 0;
    ctx.shadowOffsetY = 4;
    ctx.beginPath();
    ctx.moveTo(x - w/2 + radius, y - h/2);
    ctx.lineTo(x + w/2 - radius, y - h/2);
    ctx.quadraticCurveTo(x + w/2, y - h/2, x + w/2, y - h/2 + radius);
    ctx.lineTo(x + w/2, y + h/2 - radius);
    ctx.quadraticCurveTo(x + w/2, y + h/2, x + w/2 - radius, y + h/2);
    ctx.lineTo(x - w/2 + radius, y + h/2);
    ctx.quadraticCurveTo(x - w/2, y + h/2, x - w/2, y + h/2 - radius);
    ctx.lineTo(x - w/2, y - h/2 + radius);
    ctx.quadraticCurveTo(x - w/2, y - h/2, x - w/2 + radius, y - h/2);
    ctx.closePath();
    const grad = ctx.createLinearGradient(x - w/2, y - h/2, x + w/2, y + h/2);
    grad.addColorStop(0, color);
    grad.addColorStop(1, darkenColor(color, 0.1));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // ---- 选中边框 ----
    if (selectedId === n.id) {
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 3.5;
      ctx.shadowColor = 'rgba(245,158,11,0.3)';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(x - w/2 + radius, y - h/2);
      ctx.lineTo(x + w/2 - radius, y - h/2);
      ctx.quadraticCurveTo(x + w/2, y - h/2, x + w/2, y - h/2 + radius);
      ctx.lineTo(x + w/2, y + h/2 - radius);
      ctx.quadraticCurveTo(x + w/2, y + h/2, x + w/2 - radius, y + h/2);
      ctx.lineTo(x - w/2 + radius, y + h/2);
      ctx.quadraticCurveTo(x - w/2, y + h/2, x - w/2, y + h/2 - radius);
      ctx.lineTo(x - w/2, y - h/2 + radius);
      ctx.quadraticCurveTo(x - w/2, y - h/2, x - w/2 + radius, y - h/2);
      ctx.closePath();
      ctx.stroke();
      ctx.shadowColor = 'transparent';
    }

    // ---- 文字 ----
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = isRoot ? 'bold 16px -apple-system, "Segoe UI", Roboto, sans-serif' : '600 14px -apple-system, "Segoe UI", Roboto, sans-serif';
    ctx.textRendering = 'optimizeLegibility';
    if (!isRoot) {
      ctx.shadowColor = 'rgba(0,0,0,0.1)';
      ctx.shadowBlur = 4;
    }
    let displayText = n.text;
    const maxWidth = isRoot ? 100 : 70;
    if (ctx.measureText(displayText).width > maxWidth) {
      while (ctx.measureText(displayText + '…').width > maxWidth && displayText.length > 1) {
        displayText = displayText.slice(0, -1);
      }
      displayText += '…';
    }
    ctx.fillText(displayText, x, y + 1);
    ctx.shadowColor = 'transparent';

    // ---- 触控小圆点 ----
    if (!isRoot) {
      const dotX = x - w/2 - 12;
      const dotY = y;
      const dotR = 7;
      // 外发光
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(dotX, dotY, dotR, 0, 2 * Math.PI);
      ctx.fillStyle = selectedId === n.id ? '#f59e0b' : '#6b7280';
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // 存储热区（半径扩大）
      n._dotX = dotX;
      n._dotY = dotY;
      n._dotR = dotR + 28; // 热区半径35px
    }
  });

  document.getElementById('node-count').textContent = nodes.length + ' 节点';
  canvas._clickNodes = nodes;
}

function darkenColor(hex, amount) {
  let c = hex.replace('#', '');
  let r = parseInt(c.substring(0,2),16);
  let g = parseInt(c.substring(2,4),16);
  let b = parseInt(c.substring(4,6),16);
  r = Math.max(0, r - r * amount);
  g = Math.max(0, g - g * amount);
  b = Math.max(0, b - b * amount);
  return '#' + [r,g,b].map(x => Math.round(x).toString(16).padStart(2,'0')).join('');
}

// ============================================================
// 交互事件：修正坐标转换
// ============================================================
canvas.addEventListener('click', function(e) {
  const rect = canvas.getBoundingClientRect();
  // 直接使用CSS transform反算逻辑坐标
  const x = (e.clientX - rect.left - view.panX) / view.scale;
  const y = (e.clientY - rect.top - view.panY) / view.scale;

  const nodes = canvas._clickNodes || [];
  let hit = false;
  // 从后往前遍历（上层节点优先）
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (n.id === 'root') continue;
    if (n._dotX === undefined) continue;
    const dx = x - n._dotX, dy = y - n._dotY;
    if (dx*dx + dy*dy < n._dotR * n._dotR) {
      // 切换选中状态
      if (selectedId === n.id) {
        selectedId = null;
      } else {
        selectedId = n.id;
      }
      drawRadial();
      hit = true;
      break;
    }
  }
  if (!hit) {
    selectedId = null;
    drawRadial();
  }
});

canvas.addEventListener('dblclick', function(e) {
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left - view.panX) / view.scale;
  const y = (e.clientY - rect.top - view.panY) / view.scale;

  const nodes = canvas._clickNodes || [];
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (n.id === 'root') continue;
    if (n._dotX === undefined) continue;
    const dx = x - n._dotX, dy = y - n._dotY;
    if (dx*dx + dy*dy < n._dotR * n._dotR) {
      const node = findNode(treeData, n.id);
      if (node) {
        const newText = prompt('修改文字:', node.text);
        if (newText !== null && newText.trim() !== '') {
          node.text = newText.trim();
          drawRadial();
        }
      }
      return;
    }
  }
});

// ============================================================
// 数据操作
// ============================================================
function findNode(node, id) {
  if (node.id === id) return node;
  if (node.children) {
    for (let c of node.children) {
      const found = findNode(c, id);
      if (found) return found;
    }
  }
  return null;
}

function findParent(node, targetId, parent = null) {
  if (node.id === targetId) return parent;
  if (node.children) {
    for (let c of node.children) {
      const found = findParent(c, targetId, node);
      if (found !== undefined) return found;
    }
  }
  return undefined;
}

function countNodes(node) {
  let c = 1;
  if (node.children) {
    for (let ch of node.children) c += countNodes(ch);
  }
  return c;
}

function addChild() {
  if (!selectedId) { alert('请先点击一个小圆点选中节点'); return; }
  const parent = findNode(treeData, selectedId);
  if (!parent) { alert('选中节点不存在'); return; }
  if (!parent.children) parent.children = [];
  const colors = ['#3b82f6','#f59e0b','#8b5cf6','#10b981','#ef4444','#06b6d4','#f97316','#ec4899'];
  const newColor = colors[parent.children.length % colors.length];
  parent.children.push({
    id: 'id-' + (idCounter++),
    text: '新分支',
    collapsed: false,
    color: newColor,
    children: []
  });
  drawRadial();
}

function addSibling() {
  if (!selectedId || selectedId === 'root') { alert('请先选中一个非根节点'); return; }
  const parent = findParent(treeData, selectedId);
  if (!parent) return;
  let idx = parent.children.findIndex(c => c.id === selectedId);
  if (idx === -1) return;
  const colors = ['#3b82f6','#f59e0b','#8b5cf6','#10b981','#ef4444','#06b6d4','#f97316','#ec4899'];
  const newColor = colors[parent.children.length % colors.length];
  parent.children.splice(idx + 1, 0, {
    id: 'id-' + (idCounter++),
    text: '同级分支',
    collapsed: false,
    color: newColor,
    children: []
  });
  drawRadial();
}

function editNode() {
  if (!selectedId) { alert('请先点击小圆点选中节点'); return; }
  const node = findNode(treeData, selectedId);
  if (!node) return;
  const newText = prompt('修改文字:', node.text);
  if (newText !== null && newText.trim() !== '') {
    node.text = newText.trim();
    drawRadial();
  }
}

function deleteNode() {
  if (!selectedId || selectedId === 'root') { alert('请先选中一个非根节点'); return; }
  if (!confirm('删除该节点及其所有子节点？')) return;
  const parent = findParent(treeData, selectedId);
  if (!parent) return;
  parent.children = parent.children.filter(c => c.id !== selectedId);
  selectedId = null;
  drawRadial();
}

function toggleAll(expand) {
  function walk(node) {
    node.collapsed = !expand;
    if (node.children) node.children.forEach(walk);
  }
  walk(treeData);
  drawRadial();
}

// ---- 导入 ----
function showImportModal() {
  document.getElementById('importModal').classList.add('active');
}
function closeImportModal() {
  document.getElementById('importModal').classList.remove('active');
}
function importFromText() {
  const text = document.getElementById('importText').value;
  if (!text.trim()) { alert('请输入内容'); return; }
  const lines = text.split('\n').filter(l => l.trim());
  const root = { id: 'root', text: '📖 书摘', collapsed: false, color: '#1f2937', children: [] };
  const stack = [{ node: root, level: 0 }];
  const colors = ['#3b82f6','#f59e0b','#8b5cf6','#10b981','#ef4444','#06b6d4','#f97316','#ec4899'];
  for (let line of lines) {
    const indent = line.match(/^[\s\t]*/)[0].length;
    const level = Math.floor(indent / 2);
    const content = line.trim();
    const newNode = {
      id: 'id-' + (idCounter++),
      text: content,
      collapsed: false,
      color: colors[level % colors.length],
      children: []
    };
    while (stack.length > 1 && stack[stack.length-1].level >= level) stack.pop();
    const parent = stack[stack.length-1].node;
    if (!parent.children) parent.children = [];
    parent.children.push(newNode);
    stack.push({ node: newNode, level: level });
  }
  treeData = root;
  selectedId = null;
  closeImportModal();
  drawRadial();
}

function exportImage() {
  alert('📸 请使用手机截图功能保存。');
}
