<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>XMind 风格 · 放射导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f0f2f5;display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#333}

#header{background:#fff;padding:6px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e8eaed;flex-shrink:0;height:40px}
#header h1{font-size:16px;font-weight:600;color:#1a1a2e}
#header .badge{font-size:12px;color:#999}

#canvas-wrapper{flex:1;overflow:hidden;position:relative;background:#fafbfc;touch-action:none;cursor:grab}
#canvas-wrapper:active{cursor:grabbing}
#radial-canvas{width:100%;height:100%;display:block;transform-origin:0 0;touch-action:none}

#bottom-toolbar{background:#fff;border-top:1px solid #e8eaed;display:flex;flex-wrap:wrap;justify-content:space-around;padding:4px 0 env(safe-area-inset-bottom);flex-shrink:0}
#bottom-toolbar .group{display:flex;gap:2px;align-items:center;flex-wrap:wrap}
#bottom-toolbar button{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;font-size:10px;color:#666;padding:4px 10px;min-height:38px;min-width:38px;touch-action:manipulation;border-radius:8px}
#bottom-toolbar button .icon{font-size:18px;line-height:1.2}
#bottom-toolbar button .label{margin-top:1px;font-size:9px}
#bottom-toolbar button:active{background:#e8eaed;color:#4a6cf7}
#bottom-toolbar .del:active{color:#e74c3c}
#bottom-toolbar .zoom-btn{background:#f0f2f5;border-radius:20px;padding:2px 12px;flex-direction:row;gap:4px;min-height:30px}
#bottom-toolbar .zoom-btn .icon{font-size:14px}

.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:center;z-index:999;backdrop-filter:blur(3px)}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:16px;padding:20px;width:92%;max-width:380px;max-height:80vh;overflow-y:auto}
.modal-box h3{font-size:17px;margin-bottom:4px}
.modal-box p{font-size:13px;color:#888;margin:4px 0 12px}
.modal-box textarea{width:100%;height:140px;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:13px;resize:vertical;font-family:inherit}
.modal-box .btn-row{display:flex;gap:8px;margin-top:12px;justify-content:flex-end}
.modal-box .btn-row button{padding:8px 20px;border-radius:20px;border:none;font-size:13px;font-weight:500;min-height:36px}
.modal-box .btn-row .primary{background:#4a6cf7;color:#fff}
.modal-box .btn-row .secondary{background:#f0f2f5;color:#555}
</style>
</head>
<body>

<div id="header">
  <h1>🧠 XMind 放射</h1>
  <span class="badge" id="node-count">0 节点</span>
</div>

<div id="canvas-wrapper">
  <canvas id="radial-canvas"></canvas>
</div>

<div id="bottom-toolbar">
  <div class="group">
    <button onclick="addChild()"><span class="icon">➕</span><span class="label">子</span></button>
    <button onclick="addSibling()"><span class="icon">↕️</span><span class="label">兄弟</span></button>
    <button onclick="editNode()"><span class="icon">✏️</span><span class="label">编辑</span></button>
    <button class="del" onclick="deleteNode()"><span class="icon">🗑️</span><span class="label">删除</span></button>
  </div>
  <div class="group">
    <button onclick="showImportModal()"><span class="icon">📥</span><span class="label">导入</span></button>
    <button onclick="exportImage()"><span class="icon">🖼️</span><span class="label">导出</span></button>
    <button onclick="toggleAll(1)"><span class="icon">📂</span><span class="label">展开</span></button>
    <button onclick="toggleAll(0)"><span class="icon">📁</span><span class="label">收起</span></button>
  </div>
  <div class="group">
    <button class="zoom-btn" onclick="zoomIn()"><span class="icon">➕</span></button>
    <button class="zoom-btn" onclick="resetView()"><span class="icon">⟲</span></button>
    <button class="zoom-btn" onclick="zoomOut()"><span class="icon">➖</span></button>
  </div>
</div>

<div class="modal" id="importModal">
  <div class="modal-box">
    <h3>📥 导入大纲</h3>
    <p>缩进表示层级（2空格或1 Tab）</p>
    <textarea id="importText" placeholder="年度计划&#10;  学习&#10;    前端&#10;    英语&#10;  健身&#10;    跑步"></textarea>
    <div class="btn-row">
      <button class="secondary" onclick="closeImportModal()">取消</button>
      <button class="primary" onclick="importFromText()">生成</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 数据模型
// ============================================================
let treeData = {
  id: 'root',
  text: '🎯 中心主题',
  collapsed: false,
  color: '#2c3e50',
  children: [
    {
      id: 'n1',
      text: '需求分析',
      collapsed: false,
      color: '#3498db',
      children: [
        { id: 'n1-1', text: '用户调研', collapsed: false, color: '#1abc9c', children: [] },
        { id: 'n1-2', text: '竞品分析', collapsed: false, color: '#1abc9c', children: [] }
      ]
    },
    {
      id: 'n2',
      text: '技术选型',
      collapsed: false,
      color: '#e67e22',
      children: [
        { id: 'n2-1', text: '前端框架', collapsed: false, color: '#f39c12', children: [] },
        { id: 'n2-2', text: '后端语言', collapsed: false, color: '#f39c12', children: [] }
      ]
    },
    {
      id: 'n3',
      text: '部署上线',
      collapsed: false,
      color: '#9b59b6',
      children: [
        { id: 'n3-1', text: '服务器配置', collapsed: false, color: '#8e44ad', children: [] }
      ]
    }
  ]
};
let selectedId = 'root';
let idCounter = 100;

// ============================================================
// 视图控制
// ============================================================
const view = { scale: 1, panX: 0, panY: 0 };
const wrapper = document.getElementById('canvas-wrapper');
const canvas = document.getElementById('radial-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = wrapper.clientWidth;
  canvas.height = wrapper.clientHeight;
}

function updateTransform() {
  canvas.style.transform = `translate(${view.panX}px, ${view.panY}px) scale(${view.scale})`;
}

function zoomIn() { view.scale = Math.min(2, view.scale + 0.15); updateTransform(); drawRadial(); }
function zoomOut() { view.scale = Math.max(0.3, view.scale - 0.15); updateTransform(); drawRadial(); }
function resetView() { view.scale = 1; view.panX = 0; view.panY = 0; updateTransform(); drawRadial(); }

wrapper.addEventListener('wheel', function(e) {
  e.preventDefault();
  view.scale = Math.min(2, Math.max(0.3, view.scale + (e.deltaY > 0 ? -0.08 : 0.08)));
  updateTransform();
  drawRadial();
}, { passive: false });

// 拖动（鼠标+触屏）
let isPanning = false, startX, startY, startPanX, startPanY;
wrapper.addEventListener('mousedown', function(e) {
  if (e.target === canvas || e.target === wrapper) {
    isPanning = true;
    startX = e.clientX; startY = e.clientY;
    startPanX = view.panX; startPanY = view.panY;
    wrapper.style.cursor = 'grabbing';
  }
});
window.addEventListener('mousemove', function(e) {
  if (!isPanning) return;
  view.panX = startPanX + (e.clientX - startX) * 0.7;
  view.panY = startPanY + (e.clientY - startY) * 0.7;
  updateTransform(); drawRadial();
});
window.addEventListener('mouseup', function() {
  if (isPanning) { isPanning = false; wrapper.style.cursor = 'grab'; }
});

let touchPan = null;
wrapper.addEventListener('touchstart', function(e) {
  if (e.target === canvas || e.target === wrapper) {
    const t = e.touches[0];
    touchPan = { x: t.clientX, y: t.clientY, panX: view.panX, panY: view.panY };
  }
}, { passive: true });
wrapper.addEventListener('touchmove', function(e) {
  if (!touchPan) return;
  const t = e.touches[0];
  view.panX = touchPan.panX + (t.clientX - touchPan.x) * 0.7;
  view.panY = touchPan.panY + (t.clientY - touchPan.y) * 0.7;
  updateTransform(); drawRadial();
}, { passive: true });
wrapper.addEventListener('touchend', function() { touchPan = null; }, { passive: true });

// ============================================================
// 核心绘制（XMind 风格）
// ============================================================
function drawRadial() {
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  if (!treeData) return;

  // 1. 收集可见节点
  const nodes = [];
  function collect(node, parentId, depth) {
    if (node.collapsed) return;
    nodes.push({
      id: node.id,
      text: node.text,
      color: node.color || '#4a6cf7',
      parentId: parentId,
      depth: depth,
      children: node.children || [],
      collapsed: node.collapsed
    });
    if (node.children) {
      node.children.forEach(function(c) { collect(c, node.id, depth + 1); });
    }
  }
  collect(treeData, null, 0);

  const rootNode = nodes.find(function(n) { return n.id === 'root'; });
  if (!rootNode) return;

  const cx = w / 2, cy = h / 2;
  const baseRadius = Math.min(w, h) * 0.22;

  // 2. 递归分配角度和半径（角度范围根据子节点数量动态调整）
  function assignAngles(list, parentId, startAngle, endAngle, depth) {
    var children = list.filter(function(n) { return n.parentId === parentId; });
    if (children.length === 0) return;
    var range = endAngle - startAngle;
    var step = range / children.length;
    children.forEach(function(child, i) {
      child.angle = startAngle + step * (i + 0.5);
      // 半径随深度增加，但避免过远
      var r = baseRadius * (depth + 0.8) * 0.8;
      child.radius = Math.min(r, Math.max(w, h) * 0.35);
      // 继续分配子节点
      var halfRange = Math.min(step * 0.6, Math.PI / 3);
      assignAngles(list, child.id, child.angle - halfRange, child.angle + halfRange, depth + 1);
    });
  }

  rootNode.angle = 0;
  rootNode.radius = 0;
  rootNode.x = cx;
  rootNode.y = cy;
  assignAngles(nodes, 'root', -Math.PI * 0.5, Math.PI * 0.5, 1);

  // 3. 计算坐标
  nodes.forEach(function(n) {
    if (n.id === 'root') return;
    var parent = nodes.find(function(p) { return p.id === n.parentId; });
    if (parent && parent.x !== undefined) {
      var ang = n.angle || 0;
      var r = n.radius || 60;
      n.x = parent.x + Math.cos(ang) * r;
      n.y = parent.y + Math.sin(ang) * r;
    }
  });

  // 4. 绘制连线（二次贝塞尔，更平滑）
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = '#b0c4de';
  nodes.forEach(function(n) {
    if (n.id === 'root') return;
    var parent = nodes.find(function(p) { return p.id === n.parentId; });
    if (parent && parent.x !== undefined && parent.y !== undefined) {
      var dx = n.x - parent.x, dy = n.y - parent.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      // 控制点偏移（使曲线向外凸）
      var cpDist = dist * 0.4;
      var midX = (parent.x + n.x) / 2 + dy * 0.15;
      var midY = (parent.y + n.y) / 2 - dx * 0.15;
      ctx.beginPath();
      ctx.moveTo(parent.x, parent.y);
      ctx.quadraticCurveTo(midX, midY, n.x, n.y);
      ctx.stroke();
    }
  });

  // 5. 绘制节点（圆角矩形，带阴影）
  nodes.forEach(function(n) {
    var x = n.x, y = n.y;
    if (x === undefined || y === undefined) return;
    var isRoot = (n.id === 'root');
    var w = isRoot ? 100 : 70;
    var h = isRoot ? 40 : 32;
    var radius = 10;
    var color = n.color || (isRoot ? '#2c3e50' : '#4a6cf7');

    // 阴影
    ctx.shadowColor = 'rgba(0,0,0,0.08)';
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 3;
    ctx.beginPath();
    ctx.moveTo(x - w/2 + radius, y - h/2);
    ctx.lineTo(x + w/2 - radius, y - h/2);
    ctx.quadraticCurveTo(x + w/2, y - h/2, x + w/2, y - h/2 + radius);
    ctx.lineTo(x + w/2, y + h/2 - radius);
    ctx.quadraticCurveTo(x + w/2, y + h/2, x + w/2 - radius, y + h/2);
    ctx.lineTo(x - w/2 + radius, y + h/2);
    ctx.quadraticCurveTo(x - w/2, y + h/2, x - w/2, y + h/2 - radius);
    ctx.lineTo(x - w/2, y - h/2 + radius);
    ctx.quadraticCurveTo(x - w/2, y - h/2, x - w/2 + radius, y - h/2);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.shadowColor = 'transparent';

    // 选中边框（加粗亮色）
    if (n.id === selectedId) {
      ctx.strokeStyle = '#f5a623';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x - w/2 + radius, y - h/2);
      ctx.lineTo(x + w/2 - radius, y - h/2);
      ctx.quadraticCurveTo(x + w/2, y - h/2, x + w/2, y - h/2 + radius);
      ctx.lineTo(x + w/2, y + h/2 - radius);
      ctx.quadraticCurveTo(x + w/2, y + h/2, x + w/2 - radius, y + h/2);
      ctx.lineTo(x - w/2 + radius, y + h/2);
      ctx.quadraticCurveTo(x - w/2, y + h/2, x - w/2, y + h/2 - radius);
      ctx.lineTo(x - w/2, y - h/2 + radius);
      ctx.quadraticCurveTo(x - w/2, y - h/2, x - w/2 + radius, y - h/2);
      ctx.closePath();
      ctx.stroke();
    }

    // 文字
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = isRoot ? 'bold 15px "Segoe UI",sans-serif' : '13px "Segoe UI",sans-serif';
    var displayText = n.text;
    if (displayText.length > 8) displayText = displayText.slice(0, 7) + '…';
    ctx.fillText(displayText, x, y + 1);

    // 子节点数量小圆点（有子节点时显示）
    if (n.children && n.children.length > 0 && !n.collapsed) {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath();
      ctx.arc(x + w/2 + 6, y - h/2 + 6, 4, 0, 2*Math.PI);
      ctx.fill();
    }
  });

  // 保存节点数据供点击检测
  canvas._clickNodes = nodes;
  document.getElementById('node-count').textContent = nodes.length + ' 节点';
}

// ============================================================
// 交互：点击选中
// ============================================================
canvas.addEventListener('click', function(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var mx = (e.clientX - rect.left) * scaleX;
  var my = (e.clientY - rect.top) * scaleY;
  var cx = (mx - view.panX * scaleX) / view.scale;
  var cy = (my - view.panY * scaleY) / view.scale;

  var nodes = canvas._clickNodes || [];
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.x === undefined || n.y === undefined) continue;
    var dx = cx - n.x, dy = cy - n.y;
    var dist = Math.sqrt(dx*dx + dy*dy);
    var threshold = (n.id === 'root') ? 30 : 25;
    if (dist < threshold) {
      selectedId = n.id;
      drawRadial();
      return;
    }
  }
});

// 双击编辑（简单实现）
canvas.addEventListener('dblclick', function(e) {
  var rect = canvas.getBoundingClientRect();
  var scaleX = canvas.width / rect.width;
  var scaleY = canvas.height / rect.height;
  var mx = (e.clientX - rect.left) * scaleX;
  var my = (e.clientY - rect.top) * scaleY;
  var cx = (mx - view.panX * scaleX) / view.scale;
  var cy = (my - view.panY * scaleY) / view.scale;
  var nodes = canvas._clickNodes || [];
  for (var i = 0; i < nodes.length; i++) {
    var n = nodes[i];
    if (n.x === undefined || n.y === undefined) continue;
    var dx = cx - n.x, dy = cy - n.y;
    if (Math.sqrt(dx*dx + dy*dy) < 30) {
      editNodeById(n.id);
      return;
    }
  }
});

function editNodeById(id) {
  var node = findNode(treeData, id);
  if (!node) return;
  var newText = prompt('修改文字:', node.text);
  if (newText !== null && newText.trim() !== '') {
    node.text = newText.trim();
    drawRadial();
  }
}

// ============================================================
// 数据操作
// ============================================================
function findNode(node, id) {
  if (node.id === id) return node;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = findNode(node.children[i], id);
      if (found) return found;
    }
  }
  return null;
}

function findParent(node, targetId, parent) {
  parent = parent || null;
  if (node.id === targetId) return parent;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      var found = findParent(node.children[i], targetId, node);
      if (found !== undefined) return found;
    }
  }
  return undefined;
}

function countNodes(node) {
  var c = 1;
  if (node.children) {
    for (var i = 0; i < node.children.length; i++) {
      c += countNodes(node.children[i]);
    }
  }
  return c;
}

// ---- 添加子节点 ----
function addChild() {
  var parent = findNode(treeData, selectedId);
  if (!parent) { alert('请先点击选中一个节点'); return; }
  if (!parent.children) parent.children = [];
  // 自动生成颜色（基于父级颜色微调，或使用预设）
  var color = parent.color || '#4a6cf7';
  // 简单的亮化
  var colors = ['#3498db','#e67e22','#2ecc71','#9b59b6','#1abc9c','#e74c3c','#f39c12','#16a085'];
  var newColor = colors[parent.children.length % colors.length];
  parent.children.push({
    id: 'id-' + (idCounter++),
    text: '新分支',
    collapsed: false,
    color: newColor,
    children: []
  });
  drawRadial();
}

// ---- 添加兄弟节点 ----
function addSibling() {
  if (selectedId === 'root') { alert('根节点不能添加兄弟'); return; }
  var parent = findParent(treeData, selectedId);
  if (!parent) return;
  var idx = -1;
  for (var i = 0; i < parent.children.length; i++) {
    if (parent.children[i].id === selectedId) { idx = i; break; }
  }
  if (idx === -1) return;
  var colors = ['#3498db','#e67e22','#2ecc71','#9b59b6','#1abc9c','#e74c3c','#f39c12','#16a085'];
  var newColor = colors[parent.children.length % colors.length];
  parent.children.splice(idx + 1, 0, {
    id: 'id-' + (idCounter++),
    text: '同级分支',
    collapsed: false,
    color: newColor,
    children: []
  });
  drawRadial();
}

// ---- 编辑当前选中的节点 ----
function editNode() {
  if (selectedId === 'root') {
    var root = findNode(treeData, 'root');
    if (root) {
      var newText = prompt('修改中心主题:', root.text);
      if (newText !== null && newText.trim() !== '') {
        root.text = newText.trim();
        drawRadial();
      }
    }
    return;
  }
  var node = findNode(treeData, selectedId);
  if (!node) { alert('请先选中一个节点'); return; }
  var newText = prompt('修改文字:', node.text);
  if (newText !== null && newText.trim() !== '') {
    node.text = newText.trim();
    drawRadial();
  }
}

// ---- 删除节点 ----
function deleteNode() {
  if (selectedId === 'root') { alert('根节点不能删除'); return; }
  if (!confirm('删除该节点及其所有子节点？')) return;
  var parent = findParent(treeData, selectedId);
  if (!parent) return;
  parent.children = parent.children.filter(function(c) { return c.id !== selectedId; });
  selectedId = parent.id;
  drawRadial();
}

// ---- 展开/收起全部 ----
function toggleAll(expand) {
  function walk(node) {
    node.collapsed = !expand;
    if (node.children) {
      for (var i = 0; i < node.children.length; i++) {
        walk(node.children[i]);
      }
    }
  }
  walk(treeData);
  drawRadial();
}

// ---- 导入 ----
function showImportModal() {
  document.getElementById('importModal').classList.add('active');
}
function closeImportModal() {
  document.getElementById('importModal').classList.remove('active');
}
function importFromText() {
  var text = document.getElementById('importText').value;
  if (!text.trim()) { alert('请输入内容'); return; }
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  var root = { id: 'root', text: '📖 书摘', collapsed: false, color: '#2c3e50', children: [] };
  var stack = [{ node: root, level: 0 }];
  var colors = ['#3498db','#e67e22','#2ecc71','#9b59b6','#1abc9c','#e74c3c','#f39c12','#16a085'];
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var indent = line.match(/^[\s\t]*/)[0].length;
    var level = Math.floor(indent / 2);
    var content = line.trim();
    var newNode = {
      id: 'id-' + (idCounter++),
      text: content,
      collapsed: false,
      color: colors[ (level) % colors.length ],
      children: []
    };
    while (stack.length > 1 && stack[stack.length - 1].level >= level) {
      stack.pop();
    }
    var parent = stack[stack.length - 1].node;
    if (!parent.children) parent.children = [];
    parent.children.push(newNode);
    stack.push({ node: newNode, level: level });
  }
  treeData = root;
  selectedId = 'root';
  closeImportModal();
  drawRadial();
}

function exportImage() {
