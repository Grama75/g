<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>放射状思维导图 · XMind风格</title>
    <style>
        :root {
            --bg: #f7f8fa;
            --node-bg: #ffffff;
            --node-border: #e0e3e8;
            --node-shadow: 0 2px 10px rgba(0, 0, 0, 0.07), 0 1px 3px rgba(0, 0, 0, 0.05);
            --node-shadow-hover: 0 4px 16px rgba(0, 0, 0, 0.12), 0 2px 6px rgba(0, 0, 0, 0.08);
            --text-primary: #2c3e50;
            --text-secondary: #5a6b7d;
            --accent: #5b8ff9;
            --accent-light: #e8f0fe;
            --dot-color: #b8c4d0;
            --dot-active: #5b8ff9;
            --toolbar-bg: rgba(255, 255, 255, 0.92);
            --toolbar-border: #e0e3e8;
            --btn-bg: #ffffff;
            --btn-border: #d0d5dd;
            --btn-text: #3a4a5a;
            --btn-active: #5b8ff9;
            --danger: #e74c3c;
            --modal-bg: rgba(0, 0, 0, 0.4);
            --line-color: #c5ced8;
            --root-bg: linear-gradient(135deg, #5b8ff9 0%, #3b6fe0 100%);
            --root-text: #ffffff;
            --level1-bg: linear-gradient(135deg, #ffffff 0%, #f0f4fa 100%);
            --level2-bg: linear-gradient(135deg, #ffffff 0%, #f7f9fc 100%);
            --level3-bg: #ffffff;
            --node-radius: 10px;
            --dot-r: 7px;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            user-select: none;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
            background: var(--bg);
        }
        #canvas-container:active {
            cursor: grabbing;
        }

        #svg-layer {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }

        #nodes-layer {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: auto;
        }

        .node-wrapper {
            position: absolute;
            pointer-events: none;
            transform: translate(-50%, -50%);
        }

        .node-box {
            position: relative;
            pointer-events: auto;
            cursor: grab;
            border-radius: var(--node-radius);
            box-shadow: var(--node-shadow);
            border: 1.5px solid var(--node-border);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 16px;
            min-width: 56px;
            min-height: 36px;
            max-width: 220px;
            word-break: break-word;
            white-space: normal;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: box-shadow 0.18s ease;
            pointer-events: auto;
            cursor: grab;
            -webkit-tap-highlight-color: transparent;
            background: #ffffff; /* 后备背景，确保可见 */
        }
        .node-box:active {
            cursor: grabbing;
        }
        .node-box.selected {
            box-shadow: var(--node-shadow-hover), 0 0 0 3px var(--accent-light);
            border-color: var(--accent);
        }

        .node-box.root-node {
            background: var(--root-bg);
            color: var(--root-text);
            font-weight: 700;
            font-size: 16px;
            border-color: #2f5fc9;
            box-shadow: 0 4px 20px rgba(59, 111, 224, 0.35), 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        .node-box.level-1 {
            background: var(--level1-bg);
            font-weight: 600;
        }
        .node-box.level-2 {
            background: var(--level2-bg);
        }
        .node-box.level-3 {
            background: var(--level3-bg);
        }

        .node-dot {
            position: absolute;
            width: calc(var(--dot-r) * 2);
            height: calc(var(--dot-r) * 2);
            border-radius: 50%;
            background-color: var(--dot-color);
            border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
            pointer-events: auto;
            cursor: pointer;
            z-index: 3;
            transition: background 0.15s ease, transform 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            padding: 6px;
            background-clip: content-box;
            background-color: var(--dot-color);
            border: 2px solid #fff;
        }
        .node-dot.active {
            background-color: var(--dot-active);
            transform: scale(1.1);
            box-shadow: 0 0 0 4px rgba(91, 143, 249, 0.25), 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .node-dot:hover {
            background-color: var(--dot-active);
            transform: scale(1.1);
        }

        #toolbar {
            position: fixed;
            bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 8px;
            background: var(--toolbar-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--toolbar-border);
            border-radius: 18px;
            padding: 8px 12px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.1);
            flex-wrap: nowrap;
            overflow-x: auto;
            max-width: 96vw;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        #toolbar::-webkit-scrollbar {
            display: none;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            min-width: 44px;
            height: 44px;
            padding: 0 14px;
            border-radius: 12px;
            border: 1px solid var(--btn-border);
            background: var(--btn-bg);
            color: var(--btn-text);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            font-family: var(--font-family);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .toolbar-btn:active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            transform: scale(0.95);
        }
        .toolbar-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .toolbar-btn.primary:active {
            background: #3b6fe0;
            border-color: #3b6fe0;
        }
        .toolbar-btn.danger {
            color: var(--danger);
            border-color: #f0c4c4;
        }
        .toolbar-btn.danger:active {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }
        .toolbar-btn .icon {
            font-size: 18px;
            line-height: 1;
        }

        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            z-index: 20;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        #modal-overlay.show {
            display: flex;
        }

        #modal-box {
            background: #fff;
            border-radius: 20px;
            padding: 20px;
            width: 100%;
            max-width: 560px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        #modal-box h3 {
            font-size: 17px;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        #modal-box textarea {
            flex: 1;
            min-height: 180px;
            border: 1.5px solid var(--node-border);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-family: var(--font-family);
            resize: vertical;
            outline: none;
            color: var(--text-primary);
            background: #fafbfc;
            user-select: text;
            -webkit-user-select: text;
            touch-action: auto;
            line-height: 1.5;
        }
        #modal-box textarea:focus {
            border-color: var(--accent);
            background: #fff;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        #modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            justify-content: flex-end;
        }
        .modal-btn {
            padding: 10px 18px;
            border-radius: 10px;
            border: 1px solid var(--btn-border);
            background: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: var(--font-family);
            transition: all 0.15s ease;
            min-height: 42px;
        }
        .modal-btn.primary {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .modal-btn.primary:active {
            background: #3b6fe0;
        }
        .modal-btn:active {
            transform: scale(0.96);
        }

        #zoom-indicator {
            position: fixed;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: 16px;
            z-index: 9;
            background: var(--toolbar-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--toolbar-border);
            border-radius: 10px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            pointer-events: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        #hint-text {
            position: fixed;
            top: calc(50% - 20px);
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
            font-size: 14px;
            color: #a0aab5;
            font-weight: 500;
            text-align: center;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }
        #hint-text.hidden {
            opacity: 0;
        }

        @media (max-width: 480px) {
            .node-box {
                font-size: 12.5px;
                padding: 6px 12px;
                max-width: 160px;
                border-radius: 8px;
                min-height: 30px;
            }
            .node-box.root-node {
                font-size: 14px;
                padding: 8px 16px;
            }
            .toolbar-btn {
                min-width: 40px;
                height: 40px;
                padding: 0 10px;
                font-size: 12px;
                border-radius: 10px;
            }
            #toolbar {
                padding: 6px 8px;
                gap: 5px;
                border-radius: 14px;
                bottom: calc(8px + env(safe-area-inset-bottom, 0px));
            }
            .node-dot {
                --dot-r: 6px;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container">
        <svg id="svg-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="nodes-layer"></div>
    </div>

    <div id="hint-text">点击小圆点选中 · 拖动空白平移画布</div>

    <div id="zoom-indicator">100%</div>

    <div id="toolbar">
        <button class="toolbar-btn" data-action="add-child" title="添加子节点">
            <span class="icon">➕</span> 子节点
        </button>
        <button class="toolbar-btn" data-action="add-sibling" title="添加兄弟节点">
            <span class="icon">🔗</span> 兄弟
        </button>
        <button class="toolbar-btn" data-action="edit" title="编辑文字">
            <span class="icon">✏️</span> 编辑
        </button>
        <button class="toolbar-btn danger" data-action="delete" title="删除节点">
            <span class="icon">🗑️</span> 删除
        </button>
        <button class="toolbar-btn" data-action="expand-all" title="全部展开">展开</button>
        <button class="toolbar-btn" data-action="collapse-all" title="全部收起">收起</button>
        <button class="toolbar-btn" data-action="import" title="导入文本">
            <span class="icon">📥</span> 导入
        </button>
        <button class="toolbar-btn primary" data-action="export-png" title="导出PNG">
            <span class="icon">📤</span> 导出
        </button>
        <button class="toolbar-btn" data-action="reset-view" title="重置视图">重置</button>
    </div>

    <div id="modal-overlay">
        <div id="modal-box">
            <h3>📥 导入文本生成导图</h3>
            <textarea id="import-textarea" placeholder="支持格式：&#10;• 缩进文本（2空格=1层级）&#10;• Markdown列表（- 或 *）&#10;• 编号列表（1. 2. 3.）&#10;• 井号标题（# ## ###）&#10;&#10;示例：&#10;中心主题&#10;  分支一&#10;    子分支A&#10;    子分支B&#10;  分支二&#10;    子分支C"></textarea>
            <div id="modal-actions">
                <button class="modal-btn" id="modal-cancel">取消</button>
                <button class="modal-btn primary" id="modal-confirm">生成导图</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ==================== 数据模型 ====================
            let nodeIdCounter = 0;
            let selectedId = null;

            function createNode(text, parentId = null) {
                return {
                    id: 'n' + (++nodeIdCounter),
                    text: text,
                    parentId: parentId,
                    children: [],
                    depth: 0,
                    angle: 0,
                    sectorStart: 0,
                    sectorEnd: 360,
                    x: 0,
                    y: 0,
                    collapsed: false,
                    dotOffsetX: 0,
                    dotOffsetY: 0,
                };
            }

            // 初始数据
            let rootNode = createNode('中心主题');
            rootNode.depth = 0;
            let node1 = createNode('分支一', rootNode.id);
            let node2 = createNode('分支二', rootNode.id);
            let node3 = createNode('分支三', rootNode.id);
            let node11 = createNode('子分支 A', node1.id);
            let node12 = createNode('子分支 B', node1.id);
            let node21 = createNode('子分支 C', node2.id);
            rootNode.children = [node1, node2, node3];
            node1.children = [node11, node12];
            node2.children = [node21];

            let nodeMap = new Map();

            function buildNodeMap() {
                nodeMap.clear();
                (function traverse(node, parent) {
                    node.depth = parent ? parent.depth + 1 : 0;
                    node.parentId = parent ? parent.id : null;
                    nodeMap.set(node.id, node);
                    node.children.forEach(ch => traverse(ch, node));
                })(rootNode, null);
            }
            buildNodeMap();

            function getNode(id) { return nodeMap.get(id) || null; }
            function getRoot() { return rootNode; }

            function getVisibleNodes() {
                const result = [];
                (function traverse(node) {
                    result.push(node);
                    if (!node.collapsed) {
                        node.children.forEach(ch => traverse(ch));
                    }
                })(rootNode);
                return result;
            }

            // ==================== 布局算法 ====================
            const LAYOUT = {
                rootToLevel1: 170,
                level1ToLevel2: 130,
                level2ToLevel3: 110,
                deeper: 95,
                minSectorAngle: 15,
            };

            function getDistance(depth) {
                if (depth === 0) return 0;
                if (depth === 1) return LAYOUT.rootToLevel1;
                if (depth === 2) return LAYOUT.level1ToLevel2;
                if (depth === 3) return LAYOUT.level2ToLevel3;
                return LAYOUT.deeper;
            }

            function calculateLayout() {
                function assignSectors(node, sectorStart, sectorEnd) {
                    node.sectorStart = sectorStart;
                    node.sectorEnd = sectorEnd;
                    const childCount = node.children.length;
                    if (childCount === 0) return;
                    const sectorSize = sectorEnd - sectorStart;
                    const perChild = sectorSize / childCount;
                    node.children.forEach((child, i) => {
                        const childStart = sectorStart + i * perChild;
                        const childEnd = childStart + perChild;
                        const childCenter = childStart + perChild / 2;
                        child.angle = childCenter;
                        assignSectors(child, childStart, childEnd);
                    });
                }
                assignSectors(rootNode, 0, 360);
                (function computePositions(node, parentX, parentY) {
                    if (node.depth === 0) {
                        node.x = 0;
                        node.y = 0;
                        node.angle = 0;
                    } else {
                        const dist = getDistance(node.depth);
                        const rad = (node.angle - 90) * Math.PI / 180;
                        node.x = parentX + Math.cos(rad) * dist;
                        node.y = parentY + Math.sin(rad) * dist;
                    }
                    if (!node.collapsed) {
                        node.children.forEach(ch => computePositions(ch, node.x, node.y));
                    }
                })(rootNode, 0, 0);
            }

            // ==================== 渲染 ====================
            const container = document.getElementById('canvas-container');
            const svgLayer = document.getElementById('svg-layer');
            const nodesLayer = document.getElementById('nodes-layer');
            const zoomIndicator = document.getElementById('zoom-indicator');
            const hintText = document.getElementById('hint-text');

            let view = { scale: 1, panX: 0, panY: 0 };
            let isDragging = false;
            let dragStartX = 0, dragStartY = 0;
            let dragPanStartX = 0, dragPanStartY = 0;
            let draggedDistance = 0;
            const DRAG_THRESHOLD = 5;

            function screenToCanvas(sx, sy) {
                const rect = container.getBoundingClientRect();
                return { x: (sx - rect.left - view.panX) / view.scale, y: (sy - rect.top - view.panY) / view.scale };
            }

            function canvasToScreen(cx, cy) {
                const rect = container.getBoundingClientRect();
                return { x: rect.left + cx * view.scale + view.panX, y: rect.top + cy * view.scale + view.panY };
            }

            function render() {
                calculateLayout();
                renderSVG();
                renderNodes();
                updateZoomIndicator();
            }

            function renderSVG() {
                const rect = container.getBoundingClientRect();
                svgLayer.setAttribute('width', rect.width);
                svgLayer.setAttribute('height', rect.height);
                svgLayer.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
                let svgContent = '';
                const visibleNodes = getVisibleNodes();
                visibleNodes.forEach(node => {
                    if (node.depth === 0 || !node.parentId) return;
                    const parent = getNode(node.parentId);
                    if (!parent) return;
                    const from = canvasToScreen(parent.x, parent.y);
                    const to = canvasToScreen(node.x, node.y);
                    const fromEdge = getEdgePoint(parent, node, from);
                    const toEdge = getEdgePoint(node, parent, to, true);
                    const mx = (fromEdge.x + toEdge.x) / 2;
                    const my = (fromEdge.y + toEdge.y) / 2;
                    const cp1x = fromEdge.x + (mx - fromEdge.x) * 0.5;
                    const cp1y = fromEdge.y + (my - fromEdge.y) * 0.5;
                    const cp2x = toEdge.x + (mx - toEdge.x) * 0.5;
                    const cp2y = toEdge.y + (my - toEdge.y) * 0.5;
                    svgContent += `<path d="M ${fromEdge.x} ${fromEdge.y} C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${toEdge.x} ${toEdge.y}" stroke="${getLineColor(node.depth)}" stroke-width="${varLineWidth(node.depth)}" fill="none" stroke-linecap="round" opacity="0.7"/>`;
                });
                svgLayer.innerHTML = svgContent;
            }

            function getLineColor(depth) {
                const colors = ['#b0c4de', '#b8c9dd', '#c2d0e0', '#ccd6e2', '#d5dde6'];
                return colors[Math.min(depth - 1, colors.length - 1)] || '#d5dde6';
            }

            function varLineWidth(depth) {
                const widths = [2.2, 1.8, 1.5, 1.3, 1.1];
                return widths[Math.min(depth - 1, widths.length - 1)] || 1;
            }

            function getEdgePoint(fromNode, toNode, screenPos, isTo = false) {
                const otherScreen = isTo ? canvasToScreen(fromNode.x, fromNode.y) : canvasToScreen(toNode.x, toNode.y);
                const dx = screenPos.x - otherScreen.x;
                const dy = screenPos.y - otherScreen.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const nx = dx / dist;
                const ny = dy / dist;
                const offset = 12;
                return { x: screenPos.x - nx * offset, y: screenPos.y - ny * offset };
            }

            function renderNodes() {
                const visibleNodes = getVisibleNodes();
                // 清空节点层
                nodesLayer.innerHTML = '';
                if (visibleNodes.length === 0) {
                    console.warn('没有可见节点');
                    return;
                }
                const containerRect = container.getBoundingClientRect();
                visibleNodes.forEach(node => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'node-wrapper';
                    wrapper.dataset.nodeId = node.id;
                    const screenPos = canvasToScreen(node.x, node.y);
                    // 相对于容器的坐标
                    const left = screenPos.x - containerRect.left;
                    const top = screenPos.y - containerRect.top;
                    wrapper.style.left = left + 'px';
                    wrapper.style.top = top + 'px';

                    const box = document.createElement('div');
                    box.className = 'node-box';
                    if (node.depth === 0) box.classList.add('root-node');
                    else if (node.depth === 1) box.classList.add('level-1');
                    else if (node.depth === 2) box.classList.add('level-2');
                    else box.classList.add('level-3');
                    if (node.id === selectedId) box.classList.add('selected');
                    box.textContent = node.text;
                    box.dataset.nodeId = node.id;

                    const dot = document.createElement('div');
                    dot.className = 'node-dot';
                    if (node.id === selectedId) dot.classList.add('active');
                    dot.dataset.nodeId = node.id;

                    const dotSide = getDotSide(node);
                    const dotOffset = 16;
                    if (dotSide === 'right') {
                        dot.style.right = (-dotOffset) + 'px';
                        dot.style.top = '50%';
                        dot.style.transform = 'translateY(-50%)';
                        node.dotOffsetX = dotOffset;
                        node.dotOffsetY = 0;
                    } else if (dotSide === 'left') {
                        dot.style.left = (-dotOffset) + 'px';
                        dot.style.top = '50%';
                        dot.style.transform = 'translateY(-50%)';
                        node.dotOffsetX = -dotOffset;
                        node.dotOffsetY = 0;
                    } else if (dotSide === 'top') {
                        dot.style.top = (-dotOffset) + 'px';
                        dot.style.left = '50%';
                        dot.style.transform = 'translateX(-50%)';
                        node.dotOffsetX = 0;
                        node.dotOffsetY = -dotOffset;
                    } else {
                        dot.style.bottom = (-dotOffset) + 'px';
                        dot.style.left = '50%';
                        dot.style.transform = 'translateX(-50%)';
                        node.dotOffsetX = 0;
                        node.dotOffsetY = dotOffset;
                    }

                    wrapper.appendChild(box);
