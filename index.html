<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>思维导图</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f7fa;display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#333}

/* 顶部标题栏 */
#header{background:#fff;padding:12px 16px;text-align:center;font-size:17px;font-weight:600;color:#1a1a2e;border-bottom:1px solid #eee;flex-shrink:0;letter-spacing:.5px;box-shadow:0 1px 4px rgba(0,0,0,.02)}
#header span{color:#888;font-weight:400;font-size:13px;margin-left:8px}

/* 画布区域 */
#canvas-wrapper{flex:1;overflow:hidden;position:relative;background:#fafbfc;touch-action:none;cursor:grab}
#canvas-wrapper:active{cursor:grabbing}
#canvas-view{transform-origin:0 0;padding:30px;transition:transform .05s linear;width:fit-content;height:fit-content}

/* 树节点 - 清爽风格 */
.node{display:flex;flex-direction:column;align-items:center;position:relative}
.node-content{background:#4a6cf7;color:#fff;padding:10px 20px;border-radius:24px;font-size:15px;font-weight:500;box-shadow:0 2px 8px rgba(74,108,247,.25);margin:3px 0;border:2px solid transparent;display:flex;align-items:center;gap:6px;min-height:44px;transition:all .15s;letter-spacing:.3px;position:relative}
.node-content.root{background:#1a1a2e;font-size:18px;font-weight:700;box-shadow:0 3px 12px rgba(26,26,46,.25)}
.node-content.selected{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.35)}
.node-content:active{transform:scale(.96)}
.toggle-btn{display:inline-flex;justify-content:center;align-items:center;width:22px;height:22px;background:rgba(255,255,255,.2);border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;transition:transform .2s}
.toggle-btn.collapsed{transform:rotate(-90deg)}
.children{display:flex;justify-content:center;padding-top:16px;gap:24px;flex-wrap:wrap;position:relative}
.children.collapsed{display:none}
.children::before{content:'';position:absolute;top:0;left:50%;width:1.5px;height:16px;background:#d0d7de}
.children>.node::before{content:'';position:absolute;top:-16px;left:50%;width:1.5px;height:16px;background:#d0d7de}

/* 底部导航 - 干净整洁 */
#bottom-nav{background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom);flex-shrink:0;box-shadow:0 -1px 8px rgba(0,0,0,.04)}
#bottom-nav button{background:transparent;border:none;display:flex;flex-direction:column;align-items:center;font-size:11px;color:#888;padding:4px 12px;min-height:52px;min-width:52px;transition:color .15s;position:relative;touch-action:manipulation}
#bottom-nav button .icon{font-size:20px;line-height:1.2}
#bottom-nav button .label{margin-top:2px;font-weight:500}
#bottom-nav button:active{color:#4a6cf7}
#bottom-nav button.active{color:#4a6cf7}
#bottom-nav .del:active{color:#e74c3c}

/* 搜索栏（轻量） */
#search-bar{background:#fff;padding:8px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #f0f0f0;flex-shrink:0}
#search-bar input{flex:1;padding:8px 14px;border-radius:20px;border:1px solid #e8ecf0;font-size:14px;outline:0;background:#f5f7fa;min-height:38px;transition:all .2s}
#search-bar input:focus{border-color:#4a6cf7;background:#fff}
.highlight{background:#f5a623!important;color:#1a1a2e!important}

/* 弹窗 */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:center;z-index:999;backdrop-filter:blur(4px)}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:20px;padding:24px;width:92%;max-width:400px;max-height:80vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal-box h3{font-size:18px;margin-bottom:6px;color:#1a1a2e}
.modal-box p{font-size:13px;color:#888;margin:6px 0 14px;line-height:1.5}
.modal-box textarea{width:100%;height:180px;padding:12px;border:1px solid #e8ecf0;border-radius:12px;font-size:14px;resize:vertical;font-family:inherit;background:#fafbfc;transition:border .2s}
.modal-box textarea:focus{border-color:#4a6cf7;outline:0;background:#fff}
.modal-box .btn-row{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
.modal-box .btn-row button{padding:10px 24px;border-radius:30px;border:none;font-size:14px;font-weight:500;cursor:pointer;touch-action:manipulation;min-height:44px}
.modal-box .btn-row .primary{background:#4a6cf7;color:#fff}
.modal-box .btn-row .secondary{background:#f0f2f5;color:#555}
</style>
</head>
<body>

<!-- 标题 -->
<div id="header">🧠 思维导图 <span>轻量版</span></div>

<!-- 搜索栏 -->
<div id="search-bar">
  <input id="search-box" placeholder="🔍 搜索节点..." oninput="searchNodes(this.value)">
</div>

<!-- 画布 -->
<div id="canvas-wrapper"><div id="canvas-view"></div></div>

<!-- 底部导航 -->
<div id="bottom-nav">
  <button onclick="addChild()"><span class="icon">➕</span><span class="label">子节点</span></button>
  <button onclick="editNode()"><span class="icon">✏️</span><span class="label">编辑</span></button>
  <button onclick="showImportModal()"><span class="icon">📥</span><span class="label">导入</span></button>
  <button onclick="toggleAll(1)"><span class="icon">📂</span><span class="label">展开</span></button>
  <button class="del" onclick="deleteNode()"><span class="icon">🗑️</span><span class="label">删除</span></button>
</div>

<!-- 导入弹窗 -->
<div class="modal" id="importModal">
  <div class="modal-box">
    <h3>📥 导入文本</h3>
    <p>每行一个知识点，<strong>缩进表示层级</strong>（2空格或Tab）</p>
    <textarea id="importText" placeholder="年度计划&#10;  学习&#10;    前端&#10;  健身"></textarea>
    <div class="btn-row">
      <button class="secondary" onclick="closeImportModal()">取消</button>
      <button class="primary" onclick="importFromText()">生成导图</button>
    </div>
  </div>
</div>

<script>
// ==================== 数据 ====================
let treeData = {
  id:'root', text:'🚀 我的项目', collapsed:!1, color:'#1a1a2e',
  children:[
    { id:'n1', text:'需求分析', collapsed:!1, color:'#4a6cf7', children:[
      { id:'n1-1', text:'用户调研', collapsed:!1, color:'#6c8cff', children:[] }
    ]},
    { id:'n2', text:'技术选型', collapsed:!1, color:'#4a6cf7', children:[
      { id:'n2-1', text:'前端', collapsed:!1, color:'#6c8cff', children:[] },
      { id:'n2-2', text:'后端', collapsed:!1, color:'#6c8cff', children:[] }
    ]},
    { id:'n3', text:'部署上线', collapsed:!1, color:'#4a6cf7', children:[] }
  ]
};
let selectedId='root', idCounter=100;

// ==================== 视图 ====================
const view={scale:1,panX:0,panY:0};
const wrapper=document.getElementById('canvas-wrapper');
const viewEl=document.getElementById('canvas-view');

function updateTransform(){
  viewEl.style.transform=`translate(${view.panX}px,${view.panY}px) scale(${view.scale})`;
}

// ---- 滚轮缩放 ----
wrapper.addEventListener('wheel',e=>{
  e.preventDefault();
  view.scale=Math.min(1.8,Math.max(.4,view.scale+(e.deltaY>0?-.06:.06)));
  updateTransform();
},{passive:!1});

// ---- 拖动平移（降低灵敏度） ----
let isPanning=!1,sx,sy,spx,spy;
wrapper.addEventListener('mousedown',e=>{
  if(e.target===wrapper||e.target===viewEl){
    isPanning=!0;sx=e.clientX;sy=e.clientY;spx=view.panX;spy=view.panY;
    wrapper.style.cursor='grabbing';
  }
});
window.addEventListener('mousemove',e=>{
  if(!isPanning)return;
  view.panX=spx+(e.clientX-sx)*0.7;
  view.panY=spy+(e.clientY-sy)*0.7;
  updateTransform();
});
window.addEventListener('mouseup',()=>{if(isPanning){isPanning=!1;wrapper.style.cursor='grab'}});

// ---- 触摸拖动（降低灵敏度） ----
let tp=null;
wrapper.addEventListener('touchstart',e=>{
  if(e.target===wrapper||e.target===viewEl){
    const t=e.touches[0];
    tp={x:t.clientX,y:t.clientY,panX:view.panX,panY:view.panY};
  }
},{passive:!0});
wrapper.addEventListener('touchmove',e=>{
  if(!tp)return;
  const t=e.touches[0];
  view.panX=tp.panX+(t.clientX-tp.x)*0.7;
  view.panY=tp.panY+(t.clientY-tp.y)*0.7;
  updateTransform();
},{passive:!0});
wrapper.addEventListener('touchend',()=>{tp=null},{passive:!0});

// ==================== 渲染 ====================
function render(){
  viewEl.innerHTML=buildTreeHTML(treeData,!0);
  document.querySelectorAll('.node-content').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();selectNode(el.dataset.id)});
  });
  document.querySelectorAll('.toggle-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{e.stopPropagation();toggleCollapse(btn.dataset.id)});
  });
  document.querySelectorAll('.node-content').forEach(el=>{
    if(el.dataset.id===selectedId)el.classList.add('selected');
  });
}

function buildTreeHTML(node,isRoot){
  const hasChildren=node.children&&node.children.length>0;
  const isCollapsed=node.collapsed===!0;
  const color=node.color||(isRoot?'#1a1a2e':'#4a6cf7');
  let html=`<div class=node data-id="${node.id}">`;
  html+=`<div class="node-content ${isRoot?'root':''}" data-id="${node.id}" style="background:${color}">`;
  if(hasChildren)html+=`<span class="toggle-btn ${isCollapsed?'collapsed':''}" data-id="${node.id}">▼</span>`;
  html+=node.text;
  html+=`</div>`;
  if(hasChildren){
    html+=`<div class="children ${isCollapsed?'collapsed':''}">`;
    node.children.forEach(child=>{html+=buildTreeHTML(child,!1)});
    html+=`</div>`;
  }
  return html+'</div>';
}

function selectNode(id){selectedId=id;render()}
function findNode(node,id){if(node.id===id)return node;if(node.children){for(let c of node.children){const f=findNode(c,id);if(f)return f}}return null}
function findParent(node,targetId,p=null){if(node.id===targetId)return p;if(node.children){for(let c of node.children){const f=findParent(c,targetId,node);if(f!==undefined)return f}}return undefined}

function addChild(){
  const p=findNode(treeData,selectedId);
  if(!p)return alert('请先选中一个节点');
  if(!p.children)p.children=[];
  p.children.push({id:'id-'+(idCounter++),text:'新节点',collapsed:!1,color:'#6c8cff',children:[]});
  render();
}
function editNode(){
  const n=findNode(treeData,selectedId);
  if(!n)return alert('请先选中一个节点');
  const t=prompt('修改文字:',n.text);
  if(t!==null&&t.trim()!==''){n.text=t.trim();render()}
}
function deleteNode(){
  if(selectedId==='root')return alert('根节点不能删除');
  if(!confirm('删除该节点及所有子节点？'))return;
  const p=findParent(treeData,selectedId);
  if(!p)return;
  p.children=p.children.filter(c=>c.id!==selectedId);
  selectedId=p.id;
  render();
}
function toggleCollapse(id){
  const n=findNode(treeData,id);
  if(!n)return;
  n.collapsed=!n.collapsed;
  render();
}
function toggleAll(exp){
  function walk(n){n.collapsed=!exp;if(n.children)n.children.forEach(walk)}
  walk(treeData);
  render();
}

function searchNodes(keyword){
  const kw=keyword.trim().toLowerCase();
  document.querySelectorAll('.node-content').forEach(el=>{
    el.classList.remove('highlight');
    const txt=el.textContent.replace('▼','').trim().toLowerCase();
    if(kw&&txt.includes(kw)){
      el.classList.add('highlight');
      let p=findParent(treeData,el.dataset.id);
      while(p){if(p.collapsed)p.collapsed=!1;p=findParent(treeData,p.id)}
    }
  });
}

// ==================== 导入 ====================
function showImportModal(){document.getElementById('importModal').classList.add('active')}
function closeImportModal(){document.getElementById('importModal').classList.remove('active')}
function importFromText(){
  const text=document.getElementById('importText').value;
  if(!text.trim())return alert('请输入内容');
  const lines=text.split('\n').filter(l=>l.trim());
  const root={id:'root',text:'📖 书摘',collapsed:!1,color:'#1a1a2e',children:[]};
  const stack=[{node:root,level:0}];
  lines.forEach(line=>{
    const indent=line.match(/^[\s\t]*/)[0].length;
    const level=Math.floor(indent/2);
    const text=line.trim();
    const newNode={id:'id-'+(idCounter++),text, collapsed:!1,color:'#4a6cf7',children:[]};
    while(stack.length>1 && stack[stack.length-1].level>=level) stack.pop();
    const parent=stack[stack.length-1].node;
    if(!parent.children)parent.children=[];
    parent.children.push(newNode);
    stack.push({node:newNode,level:level});
  });
  treeData=root;selectedId='root';closeImportModal();render();
}

// ==================== 启动 ====================
render();
updateTransform();
</script>
</body>
</html>
