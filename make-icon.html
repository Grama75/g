<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成图标</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0f1116;color:#e8eef8;padding:20px;text-align:center;margin:0}
h2{font-size:16px;margin-bottom:16px}
.preview{width:120px;height:120px;margin:0 auto 20px;border-radius:24px;overflow:hidden;box-shadow:0 4px 20px rgba(100,150,255,.3)}
.preview canvas{width:100%;height:100%;display:block}
button{display:block;width:100%;max-width:300px;margin:10px auto;padding:14px;background:#5b8ff9;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
button:active{background:#3b6fe0}
.status{font-size:12px;color:#8fa3c4;margin-top:10px;min-height:20px}
</style>
</head>
<body>

<h2>生成 App 图标</h2>

<div class="preview"><canvas id="preview" width="120" height="120"></canvas></div>

<button onclick="download(192)">下载 192×192 PNG</button>
<button onclick="download(512)">下载 512×512 PNG</button>

<div class="status" id="status"></div>

<script>
function drawIcon(size){
  var canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  var ctx = canvas.getContext('2d');
  var s = size / 192;

  var r = 42 * s;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();

  var grad = ctx.createRadialGradient(size*0.5, size*0.45, 0, size*0.5, size*0.45, size*0.75);
  grad.addColorStop(0, '#2a3a6a');
  grad.addColorStop(1, '#050810');
  ctx.fillStyle = grad;
  ctx.fill();

  var lines = [
    [[96,86],[48,110]],
    [[96,86],[130,52]],
    [[96,86],[140,120]],
    [[96,86],[80,140]]
  ];
  ctx.strokeStyle = 'rgba(91,143,249,0.55)';
  ctx.lineWidth = 2.2 * s;
  ctx.lineCap = 'round';
  lines.forEach(function(l){
    ctx.beginPath();
    ctx.moveTo(l[0][0]*s, l[0][1]*s);
    ctx.lineTo(l[1][0]*s, l[1][1]*s);
    ctx.stroke();
  });

  var stars = [
    [96,86, 3.2, '#ffffff', 1],
    [60,60, 2.2, '#bcd4ff', 0.85],
    [130,52, 2.6, '#fff0c8', 0.9],
    [48,110, 2.2, '#d2beff', 0.85],
    [140,120, 2, '#ffffff', 0.75],
    [80,140, 2.4, '#bcd4ff', 0.85],
    [118,105, 1.6, '#ffffff', 0.7],
    [70,90, 1.6, '#fff0c8', 0.75]
  ];
  stars.forEach(function(st){
    ctx.beginPath();
    ctx.arc(st[0]*s, st[1]*s, st[2]*s, 0, Math.PI*2);
    ctx.globalAlpha = st[4];
    ctx.fillStyle = st[3];
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  return canvas;
}

function download(size){
  var status = document.getElementById('status');
  status.textContent = '正在生成 ' + size + '...';
  var canvas = drawIcon(size);
  canvas.toBlob(function(blob){
    if(!blob){ status.textContent = '生成失败，请重试'; return; }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'icon-' + size + '.png';
    a.click();
    status.textContent = '已生成 ' + size + '×' + size + '（' + Math.round(blob.size/1024) + ' KB）';
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }, 'image/png');
}

var p = document.getElementById('preview');
var pc = p.getContext('2d');
var src = drawIcon(120);
pc.drawImage(src, 0, 0);
</script>
</body>
</html>
