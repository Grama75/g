<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生成图标</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0f1116;color:#e8eef8;padding:20px;text-align:center;margin:0}
h2{font-size:16px;margin-bottom:16px}
.preview{width:120px;height:120px;margin:0 auto 20px;border-radius:24px;overflow:hidden;box-shadow:0 4px 20px rgba(100,150,255,.3)}
.preview svg{width:100%;height:100%;display:block}
button{display:block;width:100%;max-width:300px;margin:10px auto;padding:14px;background:#5b8ff9;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer}
button:active{background:#3b6fe0}
.hint{font-size:12px;color:#8fa3c4;margin-top:20px;line-height:1.6}
</style>
</head>
<body>

<h2>生成 App 图标</h2>

<div class="preview">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" id="srcSvg">
<defs>
<radialGradient id="g" cx="50%" cy="45%" r="60%">
<stop offset="0%" stop-color="#2a3a6a"/>
<stop offset="100%" stop-color="#050810"/>
</radialGradient>
</defs>
<rect width="192" height="192" rx="42" fill="url(#g)"/>
<circle cx="96" cy="86" r="3" fill="#ffffff"/>
<circle cx="60" cy="60" r="2" fill="#bcd4ff" opacity="0.8"/>
<circle cx="130" cy="52" r="2.5" fill="#fff0c8" opacity="0.9"/>
<circle cx="48" cy="110" r="2" fill="#d2beff" opacity="0.85"/>
<circle cx="140" cy="120" r="2" fill="#ffffff" opacity="0.7"/>
<circle cx="80" cy="140" r="2.5" fill="#bcd4ff" opacity="0.85"/>
<line x1="96" y1="86" x2="48" y2="110" stroke="#5b8ff9" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
<line x1="96" y1="86" x2="130" y2="52" stroke="#5b8ff9" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
<line x1="96" y1="86" x2="140" y2="120" stroke="#5b8ff9" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
<line x1="96" y1="86" x2="80" y2="140" stroke="#5b8ff9" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
</svg>
</div>

<button onclick="download(192)">下载 192×192 PNG</button>
<button onclick="download(512)">下载 512×512 PNG</button>

<div class="hint">
点按钮 → 浏览器会下载 PNG 到你的手机<br>
下载后重命名为 <b>icon-192.png</b> 和 <b>icon-512.png</b><br>
再上传到仓库
</div>

<script>
function download(size){
  var svg = document.getElementById('srcSvg');
  var xml = new XMLSerializer().serializeToString(svg);
  var svg64 = btoa(unescape(encodeURIComponent(xml)));
  var dataUrl = 'data:image/svg+xml;base64,' + svg64;
  var img = new Image();
  img.onload = function(){
    var canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    canvas.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'icon-' + size + '.png';
      a.click();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    }, 'image/png');
  };
  img.src = dataUrl;
}
</script>
</body>
</html>
